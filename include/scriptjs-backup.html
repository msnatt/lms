<!-- page backup (Database backup) -->
<script>
    const bkLang = JSON.parse(document.getElementById('lang-data').textContent);

    let deleteTarget = null;

    const els = {
        total: document.getElementById('backup-total'),
        statCount: document.getElementById('stat-count'),
        statSize: document.getElementById('stat-size'),
        statLatest: document.getElementById('stat-latest'),
        btnExport: document.getElementById('btn-export'),
        btnImport: document.getElementById('btn-import'),
        btnRefresh: document.getElementById('btn-refresh'),
        sqlInput: document.getElementById('sqlInput'),
        tbody: document.querySelector('#table_backup tbody'),
        tableWrap: document.getElementById('table-wrap'),
        emptyState: document.getElementById('empty-state'),
        errorState: document.getElementById('error-state'),
        retryBtn: document.getElementById('retry-btn'),
        deleteModalEl: document.getElementById('deleteModal'),
        deleteFileName: document.getElementById('delete-file-name'),
        confirmDeleteBtn: document.getElementById('confirm-delete-btn'),
        importModalEl: document.getElementById('importModal'),
        importAck: document.getElementById('import-ack'),
        confirmImportBtn: document.getElementById('confirm-import-btn'),
    };

    let deleteModal, importModal;

    function esc(value) {
        return String(value ?? '').replace(/[&<>"']/g, (c) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function formatBytes(n) {
        n = Number(n) || 0;
        const units = ['B', 'KB', 'MB', 'GB'];
        let i = 0;
        while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
        return (i === 0 ? n : n.toFixed(1)) + ' ' + units[i];
    }

    function showState(which) {
        els.tableWrap.classList.toggle('tw-hidden', which !== 'table');
        els.emptyState.classList.toggle('tw-hidden', which !== 'empty');
        els.emptyState.classList.toggle('tw-flex', which === 'empty');
        els.errorState.classList.toggle('tw-hidden', which !== 'error');
        els.errorState.classList.toggle('tw-flex', which === 'error');
    }

    document.addEventListener('DOMContentLoaded', () => {
        deleteModal = new bootstrap.Modal(els.deleteModalEl);
        importModal = new bootstrap.Modal(els.importModalEl);

        els.btnRefresh.addEventListener('click', loadBackups);
        els.retryBtn.addEventListener('click', loadBackups);
        els.btnExport.addEventListener('click', doExport);

        els.btnImport.addEventListener('click', () => {
            els.importAck.checked = false;
            els.confirmImportBtn.disabled = true;
            importModal.show();
        });
        els.importAck.addEventListener('change', () => {
            els.confirmImportBtn.disabled = !els.importAck.checked;
        });
        els.confirmImportBtn.addEventListener('click', () => {
            importModal.hide();
            els.sqlInput.click();
        });
        els.sqlInput.addEventListener('change', doImport);

        els.confirmDeleteBtn.addEventListener('click', confirmDelete);

        els.tbody.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-action]');
            if (!btn) return;
            const name = btn.dataset.name;
            if (btn.dataset.action === 'download') {
                window.location = '../config/backup_download.php?file=' + encodeURIComponent(name);
            } else if (btn.dataset.action === 'delete') {
                deleteTarget = name;
                els.deleteFileName.textContent = name;
                deleteModal.show();
            }
        });

        loadBackups();
    });

    async function loadBackups() {
        showLoading();
        try {
            const res = await fetch('../config/get_backup.php');
            if (!res.ok) throw new Error('response not ok: ' + res.status);
            const data = await res.json();
            if (!data.success) throw new Error(data.message || 'load failed');

            els.total.textContent = data.total;
            els.statCount.textContent = data.total;
            els.statSize.textContent = formatBytes(data.total_size);
            els.statLatest.textContent = data.latest || '-';

            renderRows(data.files || []);
        } catch (err) {
            console.error('[backup] load failed', err);
            showState('error');
        } finally {
            hideLoading();
        }
    }

    function renderRows(files) {
        if (files.length === 0) {
            els.tbody.innerHTML = '';
            showState('empty');
            return;
        }
        showState('table');
        els.tbody.innerHTML = files.map(f => `
            <tr>
                <td>${esc(f.name)}</td>
                <td>${esc(formatBytes(f.size))}</td>
                <td>${esc(f.modified)}</td>
                <td>
                    <div class="tw-flex tw-gap-1 tw-justify-end">
                        <button type="button" data-action="download" data-name="${esc(f.name)}" title="${esc(bkLang['download'])}"
                            class="tw-bg-slate-100 tw-text-slate-600 tw-border-0 tw-rounded-lg tw-px-2 tw-py-1 tw-text-sm hover:tw-bg-slate-200"><i class="bi bi-download"></i></button>
                        <button type="button" data-action="delete" data-name="${esc(f.name)}" title="${esc(bkLang['delete'])}"
                            class="tw-bg-red-50 tw-text-red-600 tw-border-0 tw-rounded-lg tw-px-2 tw-py-1 tw-text-sm hover:tw-bg-red-100"><i class="bi bi-trash3"></i></button>
                    </div>
                </td>
            </tr>`).join('');
    }

    async function doExport() {
        showLoading();
        els.btnExport.disabled = true;
        try {
            const res = await fetch('../config/sql_export.php', { method: 'POST' });
            const data = await res.json();
            if (!res.ok || !data.success) throw new Error(data.message || 'export failed');
            showNotify(bkLang['exportsuccess']);
            await loadBackups();
        } catch (err) {
            console.error('[backup] export failed', err);
            showNotify(bkLang['exportfailed2']);
        } finally {
            hideLoading();
            els.btnExport.disabled = false;
        }
    }

    async function doImport() {
        const file = els.sqlInput.files[0];
        if (!file) return;
        const fd = new FormData();
        fd.append('sqlFile', file);

        showLoading();
        try {
            const res = await fetch('../config/sql_import.php', { method: 'POST', body: fd });
            const data = await res.json();
            if (data.status === 'success') {
                showNotify(bkLang['importsuccess']);
                await loadBackups();
            } else {
                showNotify(bkLang['importfailed']);
            }
        } catch (err) {
            console.error('[backup] import failed', err);
            showNotify(bkLang['importfailed']);
        } finally {
            hideLoading();
            els.sqlInput.value = '';
        }
    }

    async function confirmDelete() {
        if (!deleteTarget) return;
        const fd = new FormData();
        fd.append('file', deleteTarget);

        showLoading();
        els.confirmDeleteBtn.disabled = true;
        try {
            const res = await fetch('../config/backup_delete.php', { method: 'POST', body: fd });
            const data = await res.json();
            deleteModal.hide();
            if (data.success) {
                showNotify(bkLang['deletesuccess']);
                await loadBackups();
            } else {
                showNotify(bkLang['savefailed']);
            }
        } catch (err) {
            console.error('[backup] delete failed', err);
            showNotify(bkLang['savefailed']);
        } finally {
            hideLoading();
            els.confirmDeleteBtn.disabled = false;
            deleteTarget = null;
        }
    }
</script>
