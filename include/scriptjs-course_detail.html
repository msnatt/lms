<script>
    let course = [];
    let registeredcourse = [];
    let is_registered = false;
    const langData = document.getElementById('lang-data').textContent;
    const lang = JSON.parse(langData);
    const urlParams = new URLSearchParams(window.location.search);
    const courseID = urlParams.get('courseid');
    document.addEventListener("DOMContentLoaded", async () => {
        await fetchAll();
        await prepareData();
        await showCourse();

    });

    async function fetchAll() {
        const resc = await fetch(`../config/Find_CourseAll.php?courseid=${courseID}`); // เรียกใช้ PHP
        const jresc = await resc.json();
        course = jresc[0];
        course['data'] = [];

        const resu = await fetch(`../config/Find_Units.php?courseid=${courseID}`); // เรียกใช้ PHP
        const jresu = await resu.json();

        jresu.forEach(async unit => {
            const resb = await fetch(`../config/Find_Contents.php?unitid=${unit.id}`); // เรียกใช้ PHP
            const jresb = await resb.json();

            course['data'].push({
                ...unit,
                'content': jresb
            });
        });

        const response_mycourse = await fetch("../config/Fetch_MyCourse.php?user_id=<?php echo $_SESSION['user']['id']; ?>"); // เรียกใช้ PHP
        const json_res_mycourse = await response_mycourse.json();
        registeredcourse = json_res_mycourse.courses;

        console.log(course);

        console.log(registeredcourse);
    }

    function prepareData() {
        is_registered = registeredcourse.find(c => { return parseInt(c.course_id) === parseInt(courseID) }) !== 'undefined';
    }

    async function showCourse() {
        let nameCourse = document.getElementById('name-course');
        nameCourse.textContent = course.name;

        let descCourse = document.getElementById('desc-course');
        descCourse.textContent = course.description;

        let codeCourse = document.getElementById('code-course');
        codeCourse.innerHTML = course.code;

        let objCourse = document.getElementById('obj-course');
        objCourse.innerHTML = course.objective;

        if (is_registered) {
            let btn_register = document.getElementById('btn-register');
            btn_register.style.display = 'none';
            await generateBox();
        }
    }

    function generateBox() {
        let box = document.getElementById('detail_div');
        box.innerHTML = ``;

        course.data.forEach(row => {
            let hdiv = document.createElement('div');
            hdiv.className = "p-2";
            hdiv.innerHTML = `<h3>${row.name}</h3>`;
            row.content.forEach(con => {
                let cdiv = document.createElement('div');
                cdiv.className = "p-2";
                cdiv.innerHTML = findTypeContent(con);
                hdiv.appendChild(cdiv);
            });
            box.appendChild(hdiv);
        });
    }

    function findTypeContent(content) {
        let textHTML;
        console.log(content);
        
        switch (content.type_id) {
            case 1: // Text
                textHTML = content.content;
                break;

            case 2: // Image
                textHTML = `<img src="${content.content}" alt="Image" style="width: 100%; max-width: 500px;">`;
                break;

            case 3: // Video
                const observer = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            textHTML = `
                            <iframe
                                src="${content.content}?autoplay=0&mute=1"
                                title="YouTube video"
                                frameborder="0"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                allowfullscreen
                                style="width: 100%; max-width:500px; height: 50vw; max-height:300px;">
                            </iframe>
                        `;
                            observer.disconnect(); // หยุดสังเกตเมื่อโหลด iframe แล้ว
                        }
                    });
                });
                observer.observe(textHTML);
                break;

            case 4: // PDF
                textHTML = `
                <embed src="${content.content}" type="application/pdf" width="100%" height="500px" />
                `;
                break;
            case 5: // PDF
                textHTML = `
                <a href="${content.content}"  target="_blank">${content.content}</a>
                `;
                break;
            case 6: // PDF
                // แปลง path สำหรับ HTML
                let publicPath = content.content.replace('../', '/lms/');

                textHTML = `
                <div class="d-flex justify-content-center">
                    <model-viewer src="${publicPath}"
                        alt="3D model"
                        auto-rotate
                        camera-controls
                        ar
                        style="width:100%; height:50vh; max-height: 400px;">
                    </model-viewer>
                </div>    
                `;
                break;
            case 7:
                const [id, name] = content.content.split('_');
                textHTML = `
                <div class="class d-flex flex-column justify-content-center">
                    <div class="text-center mb-2 fw-medium">
                        <?=$lang['exam']?> ${name}.
                    </div>
                    <div class="text-center">
                        <button class="btn btn-outline-success rounded-pill px-4" onclick="window.open('examination.php?exam=${id}&c=${courseID}&u=${content.unit_id}', '_blank')">
                            <?=$lang['clickhere']?>
                        </button>
                    </div>
                </div>
                `;
                break;
            default:
                textHTML = `<p>Unsupported content type</p>`;
        }

        return textHTML;

    }

</script>
