<script>
    var data = [];
    var days = [];
    var countNo = 0;
    const langData = document.getElementById('lang-data').textContent;
    const lang = JSON.parse(langData);
    const div_degree_course = document.getElementById('degree_course');

    //schedule course
    var btn_schedule = document.getElementById('btn_schedule');
    var div_schedule = document.getElementById('div_schedule');

    document.addEventListener('DOMContentLoaded', async () => {
        // fetch
        const response_details = await fetch("../config/Fetch_DetailCourse.php?course_id=<?php echo $courseid; ?>");
        const json_res_details = await response_details.json();
        let detail_course = json_res_details;

        const response_schedule = await fetch("../config/Fetch_schedule.php?course_id=<?php echo $courseid; ?>");
        const json_res_schedule = await response_schedule.json();
        let schedule = json_res_schedule;
        generate_course_schedule(schedule);

        await generateOption('image_code', detail_course['course']['image_code']);
        const imgcourse = document.getElementById('img-course');
        const course_name = document.getElementById('name_course');
        const title_course = document.getElementById('title_edit');
        const course_code = document.getElementById('code_course');
        const course_Description = document.getElementById('textBoxDescription');
        const course_Objective = document.getElementById('textBoxObjective');
        const is_publish = document.getElementById('is_publish');

        imgcourse.setAttribute('src', "../assets/images/bg_cards/" + detail_course['course']['image_code']);
        course_name.value = detail_course['course']['course_name'];
        title_course.textContent += ' ' + detail_course['course']['course_name'];
        course_code.value = detail_course['course']['course_code'];
        course_Objective.value = detail_course['course']['objective'];
        course_Description.value = detail_course['course']['description'];
        is_publish.checked = detail_course['course']['is_publish'] == 1;

        detail_course['course']['units'].forEach(unit => {
            data.push({ id: unit['unit_id'], type: 'header', content: unit['unit_name'], intro: unit['unit_introduction'], cons: unit['unit_conclusion'], is_deleted: unit['is_deleted'] });
            unit['contents'].forEach(content => {
                if (content['unit_id'] == unit['unit_id']) {
                    data.push({ id: content['content_id'], type: 'content', selecttype: content['type_id'], content: content['content'], is_deleted: content['is_deleted'] });
                }
            });
        });

        // เริ่มนับ id ของรายการใหม่ต่อจาก id ที่โหลดมาจาก DB เสมอ กัน id ชนกับของจริงในฐานข้อมูล
        // (เดิม countNo เริ่มที่ 0 ตายตัว ทั้งที่ data ข้างบน preload id จริงจาก DB มาแล้ว ถ้า id ใหม่
        // ชนกับ id จริงของ unit/content คอร์สอื่น จะพา backend ไป UPDATE ทับข้อมูลคอร์สอื่นโดยไม่ตั้งใจ)
        const maxId = data.reduce((max, row) => Math.max(max, Number(row.id) || 0), 0);
        countNo = maxId + 1;

        generate_degree_course(data);

        // เติมตัวเลือกคณะ/สาขาจริงจาก DB แล้ว preselect ค่าที่คอร์สนี้บันทึกไว้
        // (เดิม select ทั้งสองเป็น option hardcode ตายตัว ไม่เคยผูกกับข้อมูลจริง และไม่เคยถูกบันทึกเลย)
        const res_faculty = await fetch('../config/Fetch_facultyall.php');
        const json_faculty = await res_faculty.json();
        generateOptionfilter('select_faculty', json_faculty);
        document.getElementById('select_faculty').value = detail_course['course']['faculty_id'];

        const res_department = await fetch('../config/Fetch_departmentall.php');
        const json_department = await res_department.json();
        generateOptionfilter('select_department', json_department);
        document.getElementById('select_department').value = detail_course['course']['department_id'];

        btn_schedule.addEventListener('click', addScheduleRow);
    });

    function generateOptionfilter(id, json) {
        let select = document.getElementById(id);
        select.innerHTML = '';
        json.forEach(row => {
            let option = document.createElement('option');
            option.value = row.id;
            option.textContent = row.name;
            select.appendChild(option);
        });
    }

    // สร้าง element แสดงตัวอย่างเนื้อหาตามชนิด (selecttype) ด้วย createElement/textContent ล้วน
    // ไม่ใช้ innerHTML กับข้อมูลที่มาจาก DB/ผู้ใช้กรอก กัน XSS ผ่านชื่อ header หรือเนื้อหาลิงก์
    function buildContentPreview(selecttype, contentId, content) {
        const type = parseInt(selecttype);
        let el;
        switch (type) {
            case 1: // ข้อความ
                el = document.createElement('div');
                el.textContent = content;
                break;
            case 2: // รูปภาพ
                el = document.createElement('img');
                el.src = content;
                el.alt = 'Image';
                el.style.width = '100%';
                el.style.maxWidth = '200px';
                break;
            case 3: // YouTube
                el = document.createElement('iframe');
                el.src = content + '?autoplay=0&mute=1';
                el.title = 'YouTube video';
                el.setAttribute('frameborder', '0');
                el.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
                el.allowFullscreen = true;
                el.style.width = '100%';
                el.style.maxWidth = '500px';
                el.style.height = '50vw';
                el.style.maxHeight = '300px';
                break;
            case 4: // PDF
                el = document.createElement('embed');
                el.src = content;
                el.type = 'application/pdf';
                el.width = '100%';
                el.height = '50%';
                break;
            case 5: // ลิงก์
                el = document.createElement('a');
                el.textContent = content;
                break;
            case 6: { // ไฟล์แนบ / โมเดล 3 มิติ
                el = document.createElement('div');
                const filepath = content || '';
                el.textContent = filepath.split('/').pop();
                break;
            }
            case 7: { // แบบทดสอบ
                el = document.createElement('div');
                const parts = (content || '').split('_');
                el.textContent = lang['exam'] + ' ' + (parts[1] || '');
                break;
            }
            default:
                el = document.createElement('div');
                el.textContent = lang['unknowncontenttype'];
        }
        el.id = 'content_' + contentId;
        return el;
    }

    function generate_degree_course(datas) {
        const container = document.getElementById('degree_course');
        container.innerHTML = '';

        datas.forEach(row => {
            if (row['type'] == "header" && row['is_deleted'] == 0) {
                const unit_ = document.createElement('div');
                unit_.className = 'degree-item degree-item-header';

                const info = document.createElement('div');
                const titleDiv = document.createElement('div');
                titleDiv.id = 'header_' + row['id'];
                titleDiv.textContent = row['content'];
                const introDiv = document.createElement('div');
                introDiv.className = 'fs-6';
                introDiv.id = 'header_intro_' + row['id'];
                introDiv.textContent = lang['nn-intro'] + ': ' + (row['intro'] || '');
                const consDiv = document.createElement('div');
                consDiv.className = 'fs-6';
                consDiv.id = 'header_cons_' + row['id'];
                consDiv.textContent = lang['nn-conclu'] + ': ' + (row['cons'] || '');
                info.appendChild(titleDiv);
                info.appendChild(introDiv);
                info.appendChild(consDiv);
                unit_.appendChild(info);

                // ปุ่มแก้ไข Unit
                const editUnitBtn = document.createElement('button');
                editUnitBtn.id = "edit_header_" + row['id'];
                editUnitBtn.type = 'button';
                editUnitBtn.innerHTML = '<i class="bi bi-pencil"></i>';
                editUnitBtn.title = lang['edit'];
                editUnitBtn.className = 'btn btn-sm btn-outline-secondary';
                editUnitBtn.onclick = () => popup_update_header(row['id']);
                // ปุ่มลบ
                const delUnitBtn = document.createElement('button');
                delUnitBtn.id = "delete_header_" + row['id'];
                delUnitBtn.type = 'button';
                delUnitBtn.innerHTML = '<i class="bi bi-trash3"></i>';
                delUnitBtn.title = lang['delete'];
                delUnitBtn.className = 'btn btn-sm btn-outline-danger ms-2';
                delUnitBtn.onclick = () => deleteIndata(row['id'], "header");

                const end_header = document.createElement('div');
                end_header.className = 'd-flex';
                end_header.appendChild(editUnitBtn);
                end_header.appendChild(delUnitBtn);
                unit_.appendChild(end_header);
                container.appendChild(unit_);

            } else if (row['type'] == "content" && row['is_deleted'] == 0) {
                const content_ = document.createElement('div');
                content_.className = 'degree-item degree-item-content';

                content_.appendChild(buildContentPreview(row['selecttype'], row['id'], row['content']));

                // ปุ่มแก้ไข Content
                const editContentBtn = document.createElement('button');
                editContentBtn.innerHTML = '<i class="bi bi-pencil"></i>';
                editContentBtn.title = lang['edit'];
                editContentBtn.id = "edit_content_" + row['id'];
                editContentBtn.type = 'button';
                editContentBtn.className = 'btn btn-sm btn-outline-secondary';
                editContentBtn.onclick = () => popup_update_content(row['id']);
                // ปุ่มลบ
                const delcontentBtn = document.createElement('button');
                delcontentBtn.id = "delete_content_" + row['id'];
                delcontentBtn.type = 'button';
                delcontentBtn.innerHTML = '<i class="bi bi-trash3"></i>';
                delcontentBtn.title = lang['delete'];
                delcontentBtn.className = 'btn btn-sm btn-outline-danger ms-2';
                delcontentBtn.onclick = () => deleteIndata(row['id'], "content");

                const end_content = document.createElement('div');
                end_content.className = 'd-flex';
                end_content.appendChild(editContentBtn);
                end_content.appendChild(delcontentBtn);
                content_.appendChild(end_content);
                container.appendChild(content_);
            }
        });
    }

    async function generate_course_schedule(params) {
        const response_days = await fetch("../config/Fetch_days.php");
        const json_res_days = await response_days.json();
        days = json_res_days;
        params.forEach(schedule => {
            var _schedule = document.createElement('div');
            _schedule.className = "bg-light rounded m-1";
            _schedule.innerHTML = `
            <div class="d-flex p-2 justify-content-center">
                <label class="col-2"><?= $lang['day'] ?> :</label>
                <select class="form-select col-10 mx-2 w-auto" required name="select_day[]">
                    <option value=""><?= $lang['select_day'] ?></option>
                </select>
            </div>
            <div class="d-flex justify-content-around p-2">
                <label><?= $lang['start'] ?></label>
                <label><?= $lang['end'] ?></label>
            </div>
            <div class="d-flex justify-content-around p-2">
                <select class="form-select mx-2" required name="select_start[]"></select>
                <select class="form-select mx-2" required name="select_end[]"></select>
            </div>
            `;

            var id_ = document.createElement('input');
            id_.type = "hidden";
            id_.name = "id_schedule[]";
            id_.value = schedule['id'];

            var deleted_ = document.createElement('input');
            deleted_.type = "hidden";
            deleted_.name = "schedule_is_deleted[]";
            deleted_.value = schedule['is_deleted'];

            _schedule.appendChild(deleted_);
            _schedule.appendChild(id_);
            div_schedule.appendChild(_schedule);

            var select_day = _schedule.querySelector('select[name="select_day[]"]');
            var select_start = _schedule.querySelector('select[name="select_start[]"]');
            var select_end = _schedule.querySelector('select[name="select_end[]"]');

            days.forEach(day => {
                let option_day = new Option(day.name, day.id);
                select_day.add(option_day);
            });
            select_day.value = schedule.day_id;

            for (let hour = 8; hour <= 20; hour++) {
                let time = hour.toString().padStart(2, '0') + ":00";
                select_start.add(new Option(time, time));
                select_end.add(new Option(time, time));
            }

            select_start.value = schedule.start_time;
            select_end.value = schedule.end_time;
        });
    }

    `;

        var select_start = _schedule.querySelector('select[name="select_start[]"]');

        for (let hour = 8; hour <= 20; hour++) {

        }
    }

    function validateNumberInput(event) {
        // กรองเฉพาะตัวเลข
        event.target.value = event.target.value.replace(/[^0-9]/g, '');
    }

    async function fetch_typefile() {
        const response_typefile = await fetch('../config/Fetch_typefile.php');
        const json_res_typefile = await response_typefile.json();
        let types = json_res_typefile;

        const dropdown = document.getElementById('select_content');
        types.forEach(type => {
            const option = document.createElement('option');
            option.value = type.id;
            option.textContent = type.name;
            dropdown.appendChild(option);
        });
    }

    function changedropdown() {
        const dropdown_content = document.getElementById('select_content');
        dropdown_content.addEventListener('change', async () => {
            const selectedValue = dropdown_content.value;
            const content_div = document.getElementById('contentofcontent');
            let contentHtml;
            switch (selectedValue) {
                case "1": // Text Box
                    contentHtml = `
                    <label for="textBox">Enter text:</label>
                    <textarea id="inputContent" rows="4" cols="50" class="form-control"></textarea>
                `;
                    break;

                case "2": // Image
                    contentHtml = `
                    <label for="imageInput">Choose an image:</label>
                    <input type="file" id="inputContent" name="image" accept="image/*">
                    <br>
                `;
                    break;

                case "3": // Video
                    contentHtml = `
                    <label for="videoInput">Choose a video:</label>
                    <input type="file" id="inputContent" accept="video/*">
                    <br>
                `;
                    break;

                case "4": // PDF
                    contentHtml = `
                    <label for="pdfInput">Choose a PDF:</label>
                    <input type="file" id="inputContent" accept="application/pdf">
                    <br>
                `;
                    break;

                case "5": // Activity
                    contentHtml = `
                    <br>
                    <label for="pdfInput"> Write the event link here. </label>
                    <input type="text" id="inputContent" class="form-control">
                    <br>
                `;
                    break;

                case "6": // 3D
                    contentHtml = `
                    <div id="dropZone">drag or drop here. (.glb .gltf)</div>
                    <input type="file" id="inputContent" class="form-control" accept=".glb, .gltf, .bin, .jpg, .png" multiple />
                    <br>
                `;
                    break;
                case "7": // Exam
                    contentHtml = `
                    <br>
                    <div>select Examination / Quiz</div>
                    <select type="text" id="inputContent" class="form-select"></select>
                    <br>
                    <br>
                    <p class="text-danger">Don't forget create in quiz managment before do this.</p>
                `;
                    break;
                default:
                    contentHtml = "<p>Please select a content type.</p>";
            }
            content_div.innerHTML = contentHtml;
            if (selectedValue === "7") {
                let allExam = await fetch('../config/Fetch_question_sets.php');
                let json_res = await allExam.json();
                const selectQuiz = document.getElementById("inputContent");

                json_res.forEach(item => {
                    const option = document.createElement("option");
                    option.value = item.id + "_" + item.title;
                    option.textContent = item.title;
                    selectQuiz.appendChild(option);
                });
            }
        });
    }

    function clearModal(id) {
        const div_Modal = document.getElementById(id);
        div_Modal.remove();
    }

    function create_header_div() {
        const new_header_ = document.getElementById('new_header');
        const intro_header_ = document.getElementById('intro_header');
        const cons_header_ = document.getElementById('cons_header');

        data.push({ id: countNo, type: 'header', content: new_header_.value, intro: intro_header_.value, cons: cons_header_.value, is_deleted: 0, is_new: true });

        countNo++;
        generate_degree_course(data);
        clearModal('modal_div');
    }

    async function create_content_div() {
        const inputContent = document.getElementById('inputContent');
        const dropdown_content = document.getElementById('select_content');
        const selectedValue = dropdown_content.value;

        if (['1', '5', '7'].includes(selectedValue)) { // Text
            data.push({ id: countNo, type: 'content', selecttype: parseInt(selectedValue), content: inputContent.value, is_deleted: 0, is_new: true });
        } else if (['2', '3', '4', '6'].includes(selectedValue)) { // Image, Video, PDF
            await upload_file_temp(inputContent, parseInt(selectedValue));
        }

        countNo++;
        clearModal('modal_div');
        generate_degree_course(data);
    }

    // ========================== update Header and content ===================

    function deleteIndata(id, type) {
        var id_header = 0;
        data.forEach(row => {
            if (id == row['id'] && type == row['type']) {
                row['is_deleted'] = 1;
                if (type == "header") { id_header = row['id']; }
            }
            else if (id_header != 0) {
                if (row['type'] == "header") {
                    id_header = 0;
                }
                else {
                    row['is_deleted'] = 1;
                }
            }
        });
        generate_degree_course(data);
    }

    function updateIndata(id, type, content, intro, cons) {
        data.forEach(row => {
            if (id == row['id'] && type == row['type']) {
                row['content'] = content;
                if (intro !== undefined) row['intro'] = intro;
                if (cons !== undefined) row['cons'] = cons;
            }
        });
    }

                        <div class="modal-footer">

                            <button type="button" class="btn btn-secondary" onclick="clearModal('modal_div')" data-bs-dismiss="modal"><?=$lang['close']?></button>
                        </div>
                    </div>
                </div>
            </div>
        `;
        document.body.appendChild(Modal);
        const dynamicModal = new bootstrap.Modal(document.getElementById('headerModal'));
        dynamicModal.show();
        document.getElementById('update-header').addEventListener('click', () => {
            var new_content = document.getElementById('update_header');
            var new_intro = document.getElementById('intro_header');
            var new_cons = document.getElementById('cons_header');
            if (new_content) {
                update_header(id, new_content.value, new_intro.value, new_cons.value);
            }
        });
    }

    async function update_header(id, content, intro, cons) {
        const ele_header = document.getElementById('header_' + id);
        const intro_header = document.getElementById('header_intro_' + id);
        const cons_header = document.getElementById('header_cons_' + id);
        ele_header.textContent = content;
        intro_header.textContent = lang['nn-intro'] + ': ' + intro;
        cons_header.textContent = lang['nn-conclu'] + ': ' + cons;

        updateIndata(id, "header", content, intro, cons);
        clearModal('modal_div');
    };

    function popup_update_content(id) {
        const oldModal = document.getElementById('modal_div');
        if (oldModal) {
            oldModal.remove();
        }
        const Modal = document.createElement('div');
        Modal.id = 'modal_div';
        Modal.innerHTML = `
            <div class="modal " id="contentModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                <div class="modal-dialog" style="max-width: 50vw;">
                    <div class="modal-content" style="min-height: 70vh;">
                        <div class="modal-header">
                            <h5 class="modal-title" id="exampleModalLabel">Edit about of content</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <h6>Select new content.</h6>
                            <select id="select_content" class="form-select">
                                <option value="0">please select type</option>
                            </select>
                            <div id="contentofcontent" class="p-3 mt-3" style="border: 2px solid #ddd; border-radius: 1rem; background-color:#fff; min-height: 40vh;">
                                <!-- content in js -->
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-primary" id="update-content" data-bs-dismiss="modal"><?=$lang['update']?></button>
                            <button type="button" class="btn btn-secondary" onclick="clearModal('modal_div')" data-bs-dismiss="modal"><?=$lang['close']?></button>
                        </div>
                    </div>
                </div>
            </div>
        `;
        document.body.appendChild(Modal);
        const dynamicModal = new bootstrap.Modal(document.getElementById('contentModal'));
        dynamicModal.show();
        fetch_typefile();
        changedropdown();
        document.getElementById('update-content').addEventListener('click', () => {
            var new_content = document.getElementById('inputContent');
            if (new_content) {
                update_content(id, new_content);
            }
        });
    }

    async function update_content(id, content) {
        const dropdown_content = document.getElementById('select_content');
        const selectedValue = dropdown_content.value;
        const oldEl = document.getElementById('content_' + id);

        let newContentValue = null;
        if (['1', '5', '7'].includes(selectedValue)) { // Text/link/quiz
            newContentValue = content.value;
        } else if (['2', '3', '4', '6'].includes(selectedValue)) { // Image, Video, PDF, 3D
            // ไม่ push แถวใหม่ลง data ตอนเป็นการแก้ของเดิม (pushToData: false) — เดิมเรียกฟังก์ชัน
            // เดียวกับตอนสร้างใหม่ ทำให้เกิดแถวซ้ำใน data ทุกครั้งที่แก้ไขไฟล์แนบของรายการเดิม
            const uploaded = await upload_file_temp(content, selectedValue, { pushToData: false });
            if (!uploaded) {
                clearModal('modal_div');
                return;
            }
            newContentValue = uploaded.path;
        } else {
            clearModal('modal_div');
            return;
        }

        // สร้าง element ใหม่ตามชนิดเนื้อหาแล้วสลับเข้าไปแทนที่ของเดิมทั้งก้อน — เดิมยัดชื่อไฟล์ดิบ
        // เป็น innerHTML ทับ <img>/<iframe>/<embed> เดิม ทำให้ path ของไฟล์แนบพังหลังบันทึก
        const newEl = buildContentPreview(selectedValue, id, newContentValue);
        if (oldEl) {
            oldEl.replaceWith(newEl);
        }

        updateIndata(id, "content", newContentValue);
        clearModal('modal_div');
    };

    async function upload_file_temp(input, selectedValue, options = {}) {
        const pushToData = options.pushToData !== false;
        const file = input.files[0];
        if (!file) {
            console.error('Upload failed: no file selected.');
            return null;
        }

        const formData = new FormData();
        formData.append('file', file);
        formData.append('type', selectedValue);

        const response = await fetch('../config/upload_temp.php', {
            method: 'POST',
            body: formData
        });
        const result = await response.json();

        if (!result.success) {
            showNotify(result.results || lang['fail-save']);
            console.error('Upload failed:', result.results);
            return null;
        }

        if (pushToData) {
            data.push({ id: countNo, type: 'content', selecttype: parseInt(selectedValue), content: result.results, is_deleted: 0, is_new: true });
        }

        return { path: result.results, filename: result.filename };
    }

    async function update_course() {
        const formcourse = document.getElementById('form-course');

        // ตัดแถวตารางเรียนที่ยังไม่ได้เลือกวันออกก่อนส่ง ป้องกัน day_id ว่างทำให้บันทึกทั้งคอร์สล้มเหลว
        let removedIncompleteSchedule = false;
        Array.from(div_schedule.children).forEach(row => {
            const daySelect = row.querySelector('select[name="select_day[]"]');
            if (daySelect && !daySelect.value) {
                removedIncompleteSchedule = true;
                row.remove();
            }
        });
        if (removedIncompleteSchedule) {
            showNotify(lang['selectdaywarn']);
        }

        const form_course = new FormData(formcourse);
        form_course.append('data', JSON.stringify(data));

        try {
            const response = await fetch('../config/course_edit.php', {
                method: 'POST',
                body: form_course
            });
            const result = await response.json();

            // เดิมไม่เคยอ่าน response เลย เด้งกลับหน้ารายการทันทีไม่ว่าบันทึกจะสำเร็จหรือพัง
            if (result.status === 'success') {
                RedirectToPage('course');
            } else {
                showNotify(result.message || lang['fail-save']);
            }
        } catch (error) {
            console.error('Error update course:', error);
            showNotify(lang['fail-save']);
        }
    }

    async function generateOption(targetparent, optionselected) {
        let select = document.getElementById(targetparent);
        try {
            const response = await fetch('../config/get_bgcards.php');
            const files = await response.json();

            files.forEach(filename => {
                const option = document.createElement('option');
                option.value = filename;
                option.textContent = filename;
                option.selected = filename === optionselected;
                select.appendChild(option);
            });
        } catch (error) {
            console.error("เกิดข้อผิดพลาดในการโหลดไฟล์:", error);
        }
    }

    function toggleEditImage() {
        let selectimg = document.getElementById('edit-img');
        let isvisible = selectimg.classList.contains('d-none');
        selectimg.classList.replace(isvisible ? 'd-none' : 'd-block', isvisible ? 'd-block' : 'd-none');
    }

    function changeImage() {
        let showimg = document.getElementById('img-course');
        let select = document.getElementById('image_code');
        showimg.src = "../assets/images/bg_cards/" + select.value;
    }

    const imageInput = document.getElementById('imageInput');
    const preview = document.getElementById('preview');
    const imgPreview = document.getElementById('img-preview');
    const newname = document.getElementById('btn-save');

    imageInput.addEventListener('change', function () {
        const file = this.files[0];
        if (file) {
            imgPreview.src = URL.createObjectURL(file);
            preview.style.display = 'block';
            newname.style.display = 'block';
        }
    });

    function saveto() {
        const fileInput = document.getElementById('imageInput');
        const file = fileInput.files[0];
        if (!file) {
            showNotify(lang['invalidfiletype']);
            return;
        }

        const formData = new FormData();
        formData.append("image", file);

        fetch("../config/upload-card.php", {
            method: "POST",
            body: formData
        })
            .then(response => response.text())
            .then(result => {
                window.location.reload();
            })
            .catch(error => {
                console.error("เกิดข้อผิดพลาด:", error);
                showNotify(lang['fail-save']);
            });
    }

    document.getElementById('manage').addEventListener("click", () => {
        const managebox = document.getElementById('managebox');
        managebox.classList.toggle('show');
    });
</script>
