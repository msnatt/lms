<!-- page product -->
<script>
    var data = [];
    document.addEventListener('DOMContentLoaded', async () => {
        let response = await fetch('../config/files-list.php');
        let json = await response.json();

        generate_select(json, 'select-template')
        document.getElementById('stat-templates').textContent = json.length;
        generate_student();

    });

    function generate_select(values, id) {
        let select = document.getElementById(id);
        values.forEach(value => {
            const option = document.createElement('option');
            option.value = value;
            option.textContent = value;
            select.appendChild(option);
        });
    }

    async function generate_student() {
        let users = await fetch("../config/Fetch_user.php");
        let json_res = await users.json();

        let table = document.getElementById('table_list_student').getElementsByTagName('tbody')[0];
        table.innerHTML = "";

        json_res.forEach(each => {
            let newRow = table.insertRow();
            newRow.className = "student-row";
            newRow.insertCell(0).innerHTML = `
            <input type="checkbox" class="form-check-input" value="${each.name}" onchange="preview()">
            `;
            newRow.insertCell(1).innerHTML = each.code;
            newRow.insertCell(2).innerHTML = each.name;
        });

        document.getElementById('stat-total').textContent = json_res.length;
        filterStudents();
    }

    function preview() {
        let selectlist = document.getElementById('select-list');
        selectlist.innerHTML = "";
        data = [];
        const checkboxes = document.querySelectorAll('#table_list_student input[type="checkbox"]:checked');
        checkboxes.forEach(checkbox => {
            let temp = document.createElement('div');
            temp.className = "cert-chip";
            temp.textContent = checkbox.value;
            selectlist.appendChild(temp);
            data.push(checkbox.value);
        });

        if (data.length === 0) {
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'cert-chips-empty';
            emptyDiv.textContent = <?= json_encode($lang['nostudentselected'], JSON_UNESCAPED_UNICODE) ?>;
            selectlist.appendChild(emptyDiv);
        }

        document.getElementById('stat-selected').textContent = data.length;
    }

    function filterStudents() {
        const searchInput = document.getElementById('student-search');
        const query = (searchInput ? searchInput.value : '').trim().toLowerCase();
        const tbody = document.getElementById('table_list_student').getElementsByTagName('tbody')[0];
        const studentRows = Array.from(tbody.getElementsByClassName('student-row'));

        let visibleCount = 0;
        studentRows.forEach(row => {
            const code = row.cells[1].textContent.toLowerCase();
            const name = row.cells[2].textContent.toLowerCase();
            const match = code.includes(query) || name.includes(query);
            row.style.display = match ? '' : 'none';
            if (match) visibleCount++;
        });

        let noMatchRow = document.getElementById('no-match-row');
        if (visibleCount === 0 && studentRows.length > 0) {
            if (!noMatchRow) {
                noMatchRow = tbody.insertRow();
                noMatchRow.id = 'no-match-row';
                const cell = noMatchRow.insertCell(0);
                cell.colSpan = 3;
                cell.className = "text-center text-muted py-4";
                cell.textContent = <?= json_encode($lang['nomatchstudent'], JSON_UNESCAPED_UNICODE) ?>;
            }
            noMatchRow.style.display = '';
        } else if (noMatchRow) {
            noMatchRow.remove();
        }

        document.getElementById('student-count').textContent =
            <?= json_encode($lang['showing'], JSON_UNESCAPED_UNICODE) ?> + ` ${visibleCount} / ${studentRows.length}`;
    }

    async function Export() {
        if (data.length === 0) {
            showNotify(<?= json_encode($lang['selectstudentwarn'], JSON_UNESCAPED_UNICODE) ?>);
            return;
        }

        let template = document.getElementById('select-template').value;
        if (!template) {
            showNotify(<?= json_encode($lang['selecttemplatewarn'], JSON_UNESCAPED_UNICODE) ?>);
            return;
        }

        const response = await fetch('../config/course-certificate.php', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                names: data,
                template: template
            })
        });

        const result = await response.json();

        // 👉 สร้าง <a> แล้วสั่งโหลด zip
        const a = document.createElement('a');
        a.href = result.zip;
        a.download = result.zip.split('/').pop(); // ตั้งชื่อไฟล์จาก zip path
        document.body.appendChild(a);
        a.click();
        a.remove();

        window.location.href = '../pages/certificate.php';
    }


    let selectTemplate = document.getElementById('select-template');
    let imagShow = document.getElementById('image-Show');
    selectTemplate.addEventListener('change', () => {
        if (selectTemplate.value == "") {
            imagShow.setAttribute('src', `../assets/images/default-template.png`);
        }
        else {
            imagShow.setAttribute('src', `../Templates/${selectTemplate.value}`);
        }
    });

</script>
