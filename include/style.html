<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    /* =========================================================
       DESIGN SYSTEM — tokens
       These override Bootstrap 5.3's own CSS variables, so every
       existing .btn-primary / .text-primary / .bg-primary / badge /
       alert / nav-pill / form focus ring / pagination across all
       pages re-skins automatically without per-page edits.
    ========================================================= */
    :root {
        --font-sans: 'Inter', 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

        --color-primary: #4F46E5;
        --color-primary-dark: #4338CA;
        --color-primary-light: #EEF2FF;
        --color-accent: #06B6D4;
        --color-success: #16A34A;
        --color-danger: #DC2626;
        --color-warning: #D97706;
        --color-info: #0891B2;

        --color-ink: #1F2937;
        --color-muted: #6B7280;
        --color-border: #E5E7EB;
        --color-surface: #FFFFFF;
        --color-page-bg: #F4F5FA;

        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 18px;
        --radius-pill: 999px;

        --shadow-xs: 0 1px 2px rgba(15, 23, 42, .06);
        --shadow-sm: 0 2px 8px rgba(15, 23, 42, .06);
        --shadow-md: 0 8px 24px rgba(15, 23, 42, .10);
        --shadow-lg: 0 20px 45px rgba(15, 23, 42, .14);

        /* Bootstrap theme hooks */
        --bs-primary: var(--color-primary);
        --bs-primary-rgb: 79, 70, 229;
        --bs-secondary: var(--color-muted);
        --bs-secondary-rgb: 107, 114, 128;
        --bs-success: var(--color-success);
        --bs-success-rgb: 22, 163, 74;
        --bs-danger: var(--color-danger);
        --bs-danger-rgb: 220, 38, 38;
        --bs-warning: var(--color-warning);
        --bs-warning-rgb: 217, 119, 6;
        --bs-info: var(--color-info);
        --bs-info-rgb: 8, 145, 178;
        --bs-body-font-family: var(--font-sans);
        --bs-body-color: var(--color-ink);
        --bs-body-bg: var(--color-page-bg);
        --bs-border-radius: var(--radius-sm);
        --bs-border-radius-lg: var(--radius-md);
        --bs-border-radius-sm: 6px;
        --bs-border-color: var(--color-border);
        --bs-link-color: var(--color-primary);
        --bs-link-color-rgb: 79, 70, 229;
        --bs-link-hover-color: var(--color-primary-dark);
        --bs-link-hover-color-rgb: 67, 56, 202;
    }

    html, body {
        font-family: var(--font-sans);
        color: var(--color-ink);
        background-color: var(--color-page-bg);
    }

    h1, h2, h3, h4, h5, h6 {
        font-weight: 700;
        letter-spacing: -0.01em;
    }

    a { text-decoration: none; }

    ::selection { background: var(--color-primary-light); color: var(--color-primary-dark); }

    /* =========================================================
       LAYOUT — topbar / sidebar / footer
    ========================================================= */
    #wsStatus { transition: all 0.5s ease; }
    #wsStatus.hide { transform: translateY(20px); opacity: 0; }

    .app-topbar {
        position: sticky;
        top: 0;
        z-index: 1030;
        border-bottom: 1px solid var(--color-border);
        box-shadow: var(--shadow-xs);
    }

    .app-topbar .navbar-brand img { height: 36px; width: auto; object-fit: contain; }

    .topbar-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: var(--radius-md);
        border: 1px solid var(--color-border);
        background: var(--color-surface);
        color: var(--color-ink);
        transition: all .2s ease;
    }
    .topbar-toggle:hover { background: var(--color-primary-light); border-color: var(--color-primary); color: var(--color-primary); }

    .topbar-nav .nav-link {
        border-radius: var(--radius-pill);
        padding: .5rem 1rem;
        color: var(--color-ink) !important;
        font-weight: 500 !important;
    }
    .topbar-nav .nav-link:hover { background: var(--color-primary-light); color: var(--color-primary) !important; }

    .topbar-avatar {
        border-radius: 50%;
        height: 42px;
        width: 42px;
        object-fit: cover;
        border: 2px solid var(--color-primary-light);
    }

    .topbar-user-btn {
        display: flex;
        align-items: center;
        gap: .6rem;
        border-radius: var(--radius-pill);
        padding: .25rem .75rem .25rem .25rem;
        border: 1px solid transparent;
    }
    .topbar-user-btn:hover { background: var(--color-primary-light); border-color: var(--color-border); }

    .sidebar {
        width: 300px;
        min-width: 300px;
        transition: all .3s ease-in-out, padding .3s ease-in-out;
        padding: 1.1rem .9rem;
        z-index: 999;
        display: block;
        left: 0;
        border-right: 1px solid var(--color-border);
    }

    .sidebar.collapsed {
        overflow: hidden;
        padding: 0px;
        display: none;
    }

    @media (max-width: 992px) {
        .sidebar {
            position: absolute;
            width: 100%;
            height: 200vh;
            z-index: 999;
            left: 0;
            top: 20;
        }
    }

    .sidebar .navbar-nav { gap: .15rem; }
    .sidebar li { margin: 0; }
    .sidebar hr { border-color: var(--color-border); opacity: 1; margin: .85rem 0; }

    .sidebar-label {
        font-size: .72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .06em;
        color: var(--color-muted);
        padding: 0 .6rem;
        margin-bottom: .25rem;
    }

    .sidebar .nav-link,
    .sidebar .nav-secondary,
    .sidebar .btn-link.nav-link {
        display: flex;
        align-items: center;
        gap: .65rem;
        width: 100%;
        padding: .6rem .75rem;
        border-radius: var(--radius-md);
        color: var(--color-ink) !important;
        font-weight: 500 !important;
        transition: background .15s ease, color .15s ease;
    }

    .sidebar .nav-link i,
    .sidebar .nav-secondary i,
    .sidebar .btn-link.nav-link i {
        font-size: 1.05rem;
        width: 1.3rem;
        text-align: center;
        color: var(--color-muted);
    }

    .sidebar .nav-link:hover,
    .sidebar .nav-secondary:hover,
    .sidebar .btn-link.nav-link:hover {
        background: var(--color-primary-light);
        color: var(--color-primary-dark) !important;
    }
    .sidebar .nav-link:hover i,
    .sidebar .nav-secondary:hover i,
    .sidebar .btn-link.nav-link:hover i { color: var(--color-primary); }

    .sidebar .nav-link.active {
        background: var(--color-primary-light);
        color: var(--color-primary-dark) !important;
    }
    .sidebar .nav-link.active i { color: var(--color-primary); }

    .app-footer {
        background: #111827;
        color: #E5E7EB;
    }
    .app-footer a { color: #C7D2FE; }
    .app-footer a:hover { color: #fff; }
    .footer-social {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: rgba(255,255,255,.08);
        color: #fff !important;
        transition: all .2s ease;
    }
    .footer-social:hover { background: var(--color-primary); transform: translateY(-2px); }

    /* =========================================================
       COMPONENTS — cards, buttons, tables, forms
    ========================================================= */
    .dash-skeleton { display: flex; flex-direction: column; gap: 8px; padding: 4px 0; }
    .dash-skeleton-line {
        height: 12px;
        border-radius: 6px;
        background: linear-gradient(90deg, #e5e7eb 25%, #f8fafc 50%, #f8fafc 75%, #e5e7eb 100%);
        background-size: 200% 100%;
        animation: shimmer 2.4s infinite;
    }

    .skeleton-card {
        width: 100%;
        max-width: 300px;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        overflow: hidden;
        background: var(--color-surface);
        box-shadow: var(--shadow-sm);
    }
    .skeleton-card .skeleton-img {
        width: 100%;
        height: 160px;
        background: linear-gradient(90deg, #e5e7eb 25%, #f8fafc 50%, #f8fafc 75%, #e5e7eb 100%);
        background-size: 200% 100%;
        animation: shimmer 2.4s infinite;
    }
    .skeleton-card .dash-skeleton { padding: 14px 16px; }

    #loading-overlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background-color: rgba(17, 24, 39, 0.55);
        backdrop-filter: blur(4px);
        display: flex; justify-content: center; align-items: center;
        z-index: 9999;
    }
    #loading-spinner {
        border: 6px solid #e5e7eb;
        border-top: 6px solid var(--color-primary);
        border-radius: 50%;
        width: 56px; height: 56px;
        animation: spin 1s linear infinite;
    }

    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    div .roombox { background-color: var(--color-surface) !important; }
    div .roombox:hover { background-color: var(--color-primary-light) !important; }

    .text { font-weight: 500 !important; }
    .text:hover { color: var(--color-primary) !important; transform: scale(1.03); transition: transform 0.3s ease-in-out; }

    .card {
        flex: 0 0 auto;
        width: 100%;
        max-width: 300px;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
        scroll-snap-align: center;
        background: var(--color-surface);
        transition: transform .25s ease, box-shadow .25s ease;
    }
    .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
    .card-body { max-height: 140px; }

    .card-course {
        flex: 0 0 auto;
        width: 95%;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
        scroll-snap-align: center;
        background: var(--color-surface);
    }

    .bg-second-color {
        width: 100%; height: 100%;
        background: linear-gradient(to top, #eef0f6 0%, #ffffff 25%, #f7f8fb 50%, #f4f5fa 100%);
    }

    .navbar-right { margin-right: 0.5rem; }
    .pagination { justify-content: center; }
    .pagination .page-link { border-radius: var(--radius-sm); margin: 0 3px; border-color: var(--color-border); color: var(--color-ink); }
    .pagination .page-item.active .page-link { background-color: var(--color-primary); border-color: var(--color-primary); }

    .filter-section { margin-bottom: 20px; }
    .w-15 { width: 15%; }
    li { margin: 0rem 1rem 0rem 1rem; }
    .wh { width: 100%; height: 100%; }

    .item {
        border-radius: var(--radius-md);
        background-color: var(--color-surface);
        padding: 20px;
        color: var(--color-ink);
        font-size: 18px;
        width: 400px;
        box-shadow: var(--shadow-sm);
    }

    .box-main { display: flex; justify-content: center; align-items: center; height: 100%; }

    .box-chat { background-color: var(--color-surface); transition: all 0.3s; }
    .box-chat:hover { background-color: var(--color-primary-light); font-weight: 600; }

    .btn-c {
        color: var(--color-ink);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: 0.375rem 0.75rem;
        text-align: center;
        transition: all 0.3s ease;
        background: var(--color-surface);
    }
    .btn-c:hover { background-color: var(--color-primary-light); color: var(--color-primary-dark); border: 1px solid var(--color-primary); }

    .bg-shadow { box-shadow: var(--shadow-md); }
    .bg-shadow-10 { box-shadow: var(--shadow-xs); }

    .col-0 { width: 0%; }
    @media (min-width: 576px) { .col-sm-0 { width: 0%; } }
    @media (min-width: 768px) { .col-md-0 { width: 0%; } }
    @media (min-width: 992px) { .col-lg-0 { width: 0%; } }
    @media (min-width: 1200px) { .col-xl-0 { width: 0%; } }
    @media (min-width: 1400px) { .col-xxl-0 { width: 0%; } }

    .btn-newChat { border: 0px; text-align: center; align-items: center; }
    .col-flex { flex-direction: column; justify-content: space-evenly; }

    .color-primary { background-color: var(--color-primary); }
    .color-secondary { background-color: var(--color-muted); }
    .color-thirdty { background-color: var(--color-surface); }
    .color-outline-primary { border: 1px solid var(--color-primary); }

    .card-container { display: flex; position: relative; align-items: center; width: 100%; overflow: hidden; }

    input:focus, textarea:focus, select:focus {
        border: 1px solid var(--color-primary);
        box-shadow: 0 0 0 .2rem var(--color-primary-light);
    }

    .input-form {
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        background-color: var(--color-surface);
        margin: .375rem .75rem;
    }

    .popup {
        display: none;
        position: fixed;
        right: 0vw;
        top: 10vh;
        padding: 10px;
        background-color: rgba(79, 70, 229, 0.85);
        color: rgb(255, 255, 255);
        border-radius: var(--radius-md);
    }

    #chatMessages {
        height: 300px;
        overflow-y: auto;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: 8px;
        margin-bottom: 10px;
        scroll-behavior: smooth;
        background: var(--color-surface);
    }

    .chat-bot-box {
        position: fixed;
        bottom: 10%;
        right: 0%;
        width: 100%;
        height: 250px;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        padding: 10px;
        margin-top: 10px;
        box-shadow: var(--shadow-lg);
    }

    @media (min-width: 992px) {
        .chat-bot-box { width: 350px; height: 400px; right: 8%; }
    }

    .chat-bot {
        width: 300px;
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.5s ease, padding 0.5s ease;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        padding: 0 10px;
        margin-top: 10px;
        box-shadow: var(--shadow-lg);
    }

    .botmenu, .menuquickly {
        box-shadow: var(--shadow-md);
        background-color: var(--color-surface);
        border: 0;
        border-radius: 50%;
        padding: 20px;
    }
    .botmenu:hover, .menuquickly:hover { background-color: var(--color-primary-light); box-shadow: var(--shadow-lg); }

    .nav-secondary { padding: 0.25rem 0.5rem; text-decoration: none; border: 0; color: var(--color-ink); }

    .scroll-content { display: flex; gap: 20px; overflow-x: scroll; scroll-behavior: smooth; width: 100%; }
    .scroll-content::-webkit-scrollbar { display: none; }

    #users_course, #content_course { width: 75%; transition: all 0.4s ease; transform: translateX(0%); }

    .notify-alert {
        position: fixed !important;
        top: 20px; left: 50%;
        transform: translateX(-50%);
        width: auto; max-width: 80%;
        z-index: 1050;
        text-align: center;
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-md);
        border: none;
    }

    .scroll-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 40px; height: 40px;
        background-color: rgba(255, 255, 255, 0.85);
        color: var(--color-ink);
        border: 1px solid var(--color-border);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
        box-shadow: var(--shadow-xs);
        z-index: 10;
    }
    .scroll-btn:hover { background-color: var(--color-primary); color: #fff; border-color: var(--color-primary); }
    .scroll-btn.previous { left: 10px; }
    .scroll-btn.next { right: 10px; }

    table { width: 100%; border-collapse: collapse; font-family: var(--font-sans); }
    td { border: 1px solid var(--color-border); padding: 10px; color: var(--color-ink); }
    th {
        background-color: var(--color-primary);
        text-align: center;
        padding: 10px 6px;
        color: #ffffff;
        text-transform: uppercase;
        font-size: .8rem;
        letter-spacing: .03em;
    }
    tr:nth-child(even) { background-color: #F8F9FC; }
    tr:hover { background-color: var(--color-primary-light); transition: 0.2s; }
    tbody { background-color: var(--color-surface); }

    #question { scroll-behavior: smooth; }
    .switch-lg { transform: scale(1.5); }

    /* Calendar */
    .calendar {
        display: grid;
        grid-template-columns: 80px repeat(7, 1fr);
        grid-auto-rows: 40px;
        gap: 1px;
        width: 100%;
        max-width: 900px;
        margin: auto;
        background: var(--color-border);
        border-radius: var(--radius-md);
        overflow: hidden;
    }
    .time-slot { width: 6.1%; font-size: smaller; border: 0.5px solid var(--color-border); background: var(--color-surface); }
    .day-header {
        border: 1px solid var(--color-border);
        text-align: center;
        font-size: 14px;
        display: flex; align-items: center; justify-content: center;
        font-weight: bold;
        background: var(--color-primary);
        color: white;
    }
    .event { background: var(--color-success); color: white; text-align: center; border-radius: 4px; }

    .boxsq { width: 100%; max-width: 300px; border: 1px solid var(--color-border); border-radius: var(--radius-md); }

    /* infomation.php - uniform image tiles for slide / icon pickers */
    .home-thumb {
        width: 100%;
        height: 120px;
        object-fit: contain;
        background: var(--color-page-bg);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
    }

    .upload-box {
        border: 2px dashed var(--color-border);
        border-radius: var(--radius-md);
        padding: 30px;
        text-align: center;
        cursor: pointer;
        transition: border-color 0.3s, background .3s;
        background: var(--color-surface);
    }
    .upload-box:hover { border-color: var(--color-primary); background: var(--color-primary-light); }
    .upload-box img { max-width: 100%; max-height: 200px; margin-top: 10px; border-radius: var(--radius-sm); }

    #managebox {
        max-width: 1000px;
        min-height: 30svh;
        position: fixed;
        width: 0%;
        top: 12%;
        left: 50%;
        transform: translateX(-50%) scaleX(0);
        transition: all 0.3s ease-in-out;
        overflow: hidden;
        background: var(--color-surface);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
    }
    #managebox.show { width: 50%; transform: translateX(-50%) scaleX(1); }

    #manageimage { position: fixed; bottom: 5%; right: 10%; }

    @media (max-width: 992px) {
        #managebox { width: 100%; max-width: none; z-index: 999; box-shadow: var(--shadow-lg); }
        #managebox.show { width: 100%; }
        #manageimage { right: 25%; }
    }

    .video-container { width: 100%; height: 50vh; display: flex; overflow: hidden; border-radius: var(--radius-md); }
    .video-container video { width: 100%; height: 100%; object-fit: contain; }

    /* =========================================================
       HOME PAGE
    ========================================================= */
    .home-wrap, .page-wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 1.75rem 1.25rem 4rem;
    }

    .home-hero {
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: var(--shadow-md);
        margin-bottom: 3rem;
    }

    .home-carousel .carousel-inner,
    .home-carousel .carousel-item {
        height: clamp(200px, 38vw, 480px);
    }

    .home-carousel .carousel-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .home-carousel .carousel-indicators [data-bs-target] {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: rgba(255, 255, 255, .6);
        border: 0;
    }
    .home-carousel .carousel-indicators .active { background-color: #fff; }

    .home-carousel .carousel-control-prev,
    .home-carousel .carousel-control-next {
        width: 3rem;
        opacity: 0;
        transition: opacity .2s ease;
    }
    .home-carousel:hover .carousel-control-prev,
    .home-carousel:hover .carousel-control-next { opacity: 1; }

    .home-section { margin-bottom: 3.5rem; }

    .home-section-head {
        text-align: center;
        margin-bottom: 1.75rem;
    }

    .home-section-icon {
        display: block;
        font-size: 2rem;
        color: var(--color-primary);
        margin-bottom: .5rem;
    }

    .home-eyebrow, .eyebrow {
        display: inline-block;
        font-size: .72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .08em;
        color: var(--color-primary);
        background: var(--color-primary-light);
        padding: .25rem .75rem;
        border-radius: var(--radius-pill);
        margin-bottom: .6rem;
    }

    /* =========================================================
       INTERIOR PAGES — title bar, filter panel, toolbar, pagination
       (course.php and similar list/management pages)
    ========================================================= */
    .page-title {
        display: flex;
        align-items: center;
        gap: .85rem;
        margin-bottom: 1.75rem;
        flex-wrap: wrap;
    }
    .page-title h2 { margin: 0; font-size: 1.5rem; }
    .page-title-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        border-radius: var(--radius-md);
        background: var(--color-primary-light);
        color: var(--color-primary);
        font-size: 1.25rem;
        flex-shrink: 0;
    }

    .filter-card, .panel {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-xs);
        padding: 1.25rem;
    }
    .filter-card h3, .panel h3 {
        font-size: 1rem;
        display: flex;
        align-items: center;
        gap: .5rem;
        margin-bottom: 1rem;
        padding-bottom: .75rem;
        border-bottom: 1px solid var(--color-border);
    }
    .filter-card .form-label, .panel .form-label {
        font-size: .8rem;
        font-weight: 600;
        color: var(--color-muted);
        margin-top: .9rem;
        margin-bottom: .3rem;
