<!-- page product -->
<script>
    var data = [];
    var allUsers = [];

    document.addEventListener('DOMContentLoaded', async () => {
        let course = await fetch("../config/Fetch_Course.php");
        let json_res = await course.json();
        generate_select(json_res, 'select-course');
        await generate_student();

        document.getElementById('select-course').addEventListener('change', loadRegisteredStudents);
    });

    function generate_select(values, id) {
        let select = document.getElementById(id);
        values.forEach(value => {
            const option = document.createElement('option');
            option.value = value.id;
            option.textContent = value.name;
            select.appendChild(option);
        });
    }

    async function generate_student() {
        let users = await fetch("../config/Fetch_user.php");
        let json_res = await users.json();
        allUsers = json_res.filter(u => u.is_admin != 1);

        let table = document.getElementById('table_list_student').getElementsByTagName('tbody')[0];
        table.innerHTML = "";

        allUsers.forEach(each => {
            let newRow = table.insertRow();
            newRow.className = "student-row";
            let cell0 = newRow.insertCell(0);
            let checkbox = document.createElement('input');
            checkbox.type = "checkbox";
            checkbox.className = "form-check-input";
            checkbox.value = each.id;
            checkbox.addEventListener('change', preview);
            cell0.appendChild(checkbox);
            newRow.insertCell(1).textContent = each.code;
            newRow.insertCell(2).textContent = each.name;
        });
    }

    async function loadRegisteredStudents() {
        let select = document.getElementById('select-course');
        if (!select.value) return;

        const response = await fetch(`../config/Fetch_course_access.php?courseid=${select.value}`);
        const registered = await response.json();
        const registeredIds = registered.map(r => String(r.user_id));

        document.querySelectorAll('#table_list_student input[type="checkbox"]').forEach(checkbox => {
            checkbox.checked = registeredIds.includes(checkbox.value);
        });

        preview();
    }

    function preview() {
        let selectlist = document.getElementById('select-list');
        selectlist.innerHTML = "";
        data = [];
        const checkboxes = document.querySelectorAll('#table_list_student input[type="checkbox"]:checked');
        checkboxes.forEach(checkbox => {
            const user = allUsers.find(u => String(u.id) === checkbox.value);
            let temp = document.createElement('div');
            temp.className = "cert-chip";
            temp.textContent = user ? user.name : checkbox.value;
            selectlist.appendChild(temp);
            data.push(checkbox.value);
        });

        if (data.length === 0) {
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'cert-chips-empty';
            emptyDiv.textContent = <?= json_encode($lang['nostudentselected'], JSON_UNESCAPED_UNICODE) ?>;
            selectlist.appendChild(emptyDiv);
        }
    }

    async function accessall() {
        let select = document.getElementById('select-course');
        if (!select.value) {
            showNotify(<?= json_encode($lang['pleaseselectcourse'], JSON_UNESCAPED_UNICODE) ?>);
            return;
        }

        let formdata = new FormData();
        formdata.append("course_id", select.value);
        data.forEach(id => formdata.append("users[]", id));

        const btn = document.getElementById('btn-save');
        btn.disabled = true;
        showLoading();

        try {
            const response = await fetch("../config/course_access.php", {
                method: 'POST',
                body: formdata
            });
            const result = await response.json();

            const messages = {
                accesssaved: <?= json_encode($lang['accesssaved'], JSON_UNESCAPED_UNICODE) ?>,
                savefailed: <?= json_encode($lang['savefailed'], JSON_UNESCAPED_UNICODE) ?>,
                nocourse: <?= json_encode($lang['pleaseselectcourse'], JSON_UNESCAPED_UNICODE) ?>,
                forbidden: <?= json_encode($lang['error'], JSON_UNESCAPED_UNICODE) ?>
            };

            if (result.success) {
                const registeredLabel = <?= json_encode($lang['registeredcount'], JSON_UNESCAPED_UNICODE) ?>;
                const removedLabel = <?= json_encode($lang['removedcount'], JSON_UNESCAPED_UNICODE) ?>;
                showNotify(`${messages[result.message] || result.message} (${registeredLabel} ${result.registered}, ${removedLabel} ${result.removed})`);
                await loadRegisteredStudents();
            } else {
                showNotify(messages[result.message] || result.message || <?= json_encode($lang['error'], JSON_UNESCAPED_UNICODE) ?>);
            }
        } catch (error) {
            console.error("Error:", error);
            showNotify(<?= json_encode($lang['savefailed'], JSON_UNESCAPED_UNICODE) ?>);
        } finally {
            btn.disabled = false;
            hideLoading();
        }
    }
</script>
