<!-- Home page data loader -->
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        showLoading();

        try {
            await Promise.all([
                loadHomeProfile(),
                loadFeaturedCourses()
            ]);
        } finally {
            hideLoading();
        }
    });

    async function loadHomeProfile() {
        try {
            let response = await fetch("../config/Fetch_homeprofile.php");
            let json = await response.json();
            json = json[0];
            if (!json) return;

            Object.entries(json).forEach(([key, value]) => {
                if (key === 'id' || key === 'youtube_id') {
                    return;
                }
                const element = document.getElementById(key);
                if (!element) {
                    return;
                }
                element.setAttribute('src', "../assets/images/home/" + value);
            });
        } catch (err) {
            console.error('Failed to load home profile:', err);
        }
    }

    async function loadFeaturedCourses() {
        const container = document.getElementById('featured-courses');
        if (!container) return;

        try {
            let response = await fetch("../config/Fetch_HomeCourse.php");
            let courses = await response.json();

            if (!Array.isArray(courses) || courses.length === 0) {
                container.innerHTML = `
                    <div class="tw-col-span-full tw-text-center tw-text-slate-500 tw-py-10">
                        ${window.LANG_NOCOURSE || 'No courses are available at the moment.'}
                    </div>
                `;
                return;
            }

            container.innerHTML = courses.map(course => `
                <div class="tw-bg-white tw-rounded-xl tw-shadow tw-overflow-hidden tw-cursor-pointer tw-transition tw-duration-300 hover:tw-shadow-lg hover:-tw-translate-y-1"
                    onclick="handleFeaturedCourseClick('${course.id}')">
                    <img src="../assets/images/bg_cards/${course.image_code}" class="tw-w-full tw-h-40 tw-object-cover" loading="lazy" alt="${course.name}">
                    <div class="tw-p-4">
                        <h5 class="tw-font-bold tw-mb-2">${course.code} ${course.name}</h5>
                        <p class="tw-text-sm tw-text-slate-600">${(course.description || '').substring(0, 80)}...</p>
                    </div>
                </div>
            `).join("");
        } catch (err) {
            console.error('Failed to load featured courses:', err);
            container.innerHTML = `
                <div class="tw-col-span-full tw-text-center tw-text-slate-500 tw-py-10">
                    ${window.LANG_NOCOURSE || 'No courses are available at the moment.'}
                </div>
            `;
        }
    }

    function handleFeaturedCourseClick(courseId) {
        if (window.IS_LOGGED_IN) {
            window.location.href = `../components/Set_Course.php?courseid=${courseId}`;
        } else {
            window.location.href = "../pages/login.php";
        }
    }
</script>
