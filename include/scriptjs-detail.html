<!-- page product -->
<script>
    const lang = JSON.parse(document.getElementById('lang-data').textContent);
    const pageData = JSON.parse(document.getElementById('page-data').textContent);

    let removeStudentTarget = null; // { owner_id, name } รอ modal ยืนยันก่อนถอนสมาชิก

    document.addEventListener('DOMContentLoaded', async () => {
        await loadDetail();

        document.getElementById('confirmRemoveStudentBtn').addEventListener('click', confirmRemoveStudent);

        const searchBox = document.getElementById('search_box');
        if (searchBox) {
            searchBox.addEventListener('input', filterMembers);
        }
    });

    async function loadDetail() {
        showLoadingById('content_course');
        try {
            const fetches = [
                fetch(`../config/Fetch_DetailCourse.php?course_id=${pageData.courseid}`).then(r => r.json()),
                fetch(`../config/Fetch_schedule.php?course_id=${pageData.courseid}`).then(r => r.json()),
                fetch(`../config/Fetch_days.php`).then(r => r.json()),
            ];
            if (pageData.can_manage_members) {
                fetches.push(fetch(`../config/Fetch_usercourse.php?courseid=${pageData.courseid}`).then(r => r.json()));
            }

            const [detailRes, scheduleRes, daysRes, membersRes] = await Promise.all(fetches);

            const course = detailRes && detailRes.course ? detailRes.course : null;
            if (!course) {
                showNotify(lang['loadfailed']);
                return;
            }

            renderCourseInfo(course);
            renderUnits(course);

            const schedules = Array.isArray(scheduleRes) ? scheduleRes : [];
            const days = Array.isArray(daysRes) ? daysRes : [];
            renderCalendar(schedules, days);

            const members = (membersRes && Array.isArray(membersRes.users)) ? membersRes.users : [];
            renderMembers(members);
        } catch (error) {
            console.error('Load detail failed:', error);
            showNotify(lang['loadfailed']);
        } finally {
            hideLoadingById('content_course');
        }
    }

    function renderCourseInfo(course) {
        document.getElementById('course-thumb-img').src = '../assets/images/bg_cards/' + course.image_code;
        document.getElementById('course-description').textContent = course.description || '';
        document.getElementById('course-objective').textContent = course.objective || '';

        const registerBtn = document.getElementById('register_btn');
        if (pageData.is_admin || pageData.can_manage_members) {
            // admin/เจ้าของคอร์สไม่ต้องลงทะเบียน ซ่อนปุ่มไปเลย
            registerBtn.classList.add('d-none');
        } else if (pageData.is_registered) {
            registerBtn.textContent = lang['registered'];
            registerBtn.disabled = true;
        } else {
            registerBtn.textContent = lang['registerc'];
            registerBtn.disabled = false;
            registerBtn.addEventListener('click', registerCourse);
        }
    }

    async function registerCourse() {
        const registerBtn = document.getElementById('register_btn');
        registerBtn.disabled = true;
        try {
            const formData = new FormData();
            formData.append('course_id', pageData.courseid);

            const res = await fetch('../config/mycourse_create.php', { method: 'POST', body: formData });
            const result = await res.json();

            if (result.status === 'success') {
                showNotify(lang['registersuccess']);
                window.location.reload();
            } else {
                showNotify(result.message || lang['registerfailed']);
                registerBtn.disabled = false;
            }
        } catch (error) {
            console.error('Register failed:', error);
            showNotify(lang['registerfailed']);
            registerBtn.disabled = false;
        }
    }

    // ต้องมี <model-viewer> เฉพาะตอนคอร์สมีเนื้อหาโมเดล 3 มิติ (type 6) จริงเท่านั้น
    // เดิมโหลด CDN นี้ทุกครั้งไม่ว่าคอร์สจะมีเนื้อหาแบบนี้หรือไม่
    function ensureModelViewerLoaded() {
        if (document.getElementById('model-viewer-script')) return;
        const script = document.createElement('script');
        script.id = 'model-viewer-script';
        script.type = 'module';
        script.src = 'https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js';
        document.head.appendChild(script);
    }

    function renderUnits(course) {
        const container = document.getElementById('content_course');
        const lockedBox = document.getElementById('content-locked');
        container.innerHTML = '';

        if (!pageData.can_see_content) {
            lockedBox.classList.remove('d-none');
            container.classList.add('d-none');
            return;
        }
        lockedBox.classList.add('d-none');
        container.classList.remove('d-none');

        const units = Array.isArray(course.units) ? course.units : [];
        if (units.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'cert-chips-empty';
            empty.textContent = lang['nounit'];
            container.appendChild(empty);
            return;
        }

        const hasModel = units.some(u => (u.contents || []).some(c => Number(c.type_id) === 6));
        if (hasModel) ensureModelViewerLoaded();

        units.forEach(unit => {
            if (unit.is_deleted == 1) return;

            const header = document.createElement('div');
            header.className = 'degree-item degree-item-header';
            header.style.cursor = 'pointer';

            const headerLeft = document.createElement('div');
            const chevron = document.createElement('i');
            chevron.className = 'bi bi-chevron-right me-2';
            const titleSpan = document.createElement('span');
            titleSpan.textContent = unit.unit_name;
            headerLeft.appendChild(chevron);
            headerLeft.appendChild(titleSpan);

            const introSpan = document.createElement('span');
            introSpan.className = 'badge text-bg-light';
            introSpan.textContent = (unit.contents || []).filter(c => c.is_deleted != 1).length;

            header.appendChild(headerLeft);
            header.appendChild(introSpan);
            container.appendChild(header);

            const body = document.createElement('div');
            body.style.display = 'none';
            body.style.paddingLeft = '1.5rem';
            container.appendChild(body);

            header.addEventListener('click', () => {
                const isVisible = body.style.display === 'block';
                body.style.display = isVisible ? 'none' : 'block';
                chevron.className = isVisible ? 'bi bi-chevron-right me-2' : 'bi bi-chevron-down me-2';
            });

            if (unit.unit_introduction) {
                const introText = document.createElement('div');
                introText.className = 'text-muted mb-2';
                introText.textContent = unit.unit_introduction;
                body.appendChild(introText);
            }

            (unit.contents || []).forEach(content => {
                if (content.is_deleted == 1) return;
                const row = document.createElement('div');
                row.className = 'degree-item';
                row.style.marginBottom = '.5rem';
                row.appendChild(renderContentItem(content.type_id, content.content, unit));
                body.appendChild(row);
            });

            if (unit.unit_conclusion) {
                const consWrap = document.createElement('div');
                consWrap.className = 'mt-2';
                const consTitle = document.createElement('div');
                consTitle.className = 'fw-bold';
                consTitle.textContent = lang['conclusion'];
                const consText = document.createElement('div');
                consText.textContent = unit.unit_conclusion;
                consWrap.appendChild(consTitle);
                consWrap.appendChild(consText);
                body.appendChild(consWrap);
            }
        });
    }

    // สร้าง element แสดงเนื้อหาตามชนิด — ใช้ createElement/textContent ทั้งหมด (ไม่ใช้ innerHTML
    // กับข้อมูลจาก DB) ยกเว้น type 1 ซึ่งเป็น rich text ที่ตั้งใจให้เป็น HTML จาก editor โดยตรง
    function renderContentItem(typeId, content, unit) {
        const type = Number(typeId);
        const wrap = document.createElement('div');
        wrap.style.width = '100%';

        switch (type) {
            case 1: // ข้อความ (rich text จาก editor — ตั้งใจให้เป็น HTML)
                wrap.innerHTML = content;
                break;
            case 2: { // รูปภาพ
                const img = document.createElement('img');
                img.src = content;
                img.alt = 'Image';
                img.style.width = '100%';
                img.style.maxWidth = '500px';
                wrap.appendChild(img);
                break;
            }
            case 3: { // YouTube — โหลดแบบ lazy ด้วย IntersectionObserver
                const observer = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const iframe = document.createElement('iframe');
                            iframe.src = content + '?autoplay=0&mute=1';
                            iframe.title = 'YouTube video';
                            iframe.setAttribute('frameborder', '0');
                            iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
                            iframe.allowFullscreen = true;
                            iframe.style.width = '100%';
                            iframe.style.maxWidth = '500px';
                            iframe.style.height = '50vw';
                            iframe.style.maxHeight = '300px';
                            wrap.appendChild(iframe);
                            observer.disconnect();
                        }
                    });
                });
                observer.observe(wrap);
                break;
            }
            case 4: { // PDF
                const embed = document.createElement('embed');
                embed.src = content;
                embed.type = 'application/pdf';
                embed.width = '100%';
                embed.height = '500';
                wrap.appendChild(embed);
                break;
            }
            case 5: { // ลิงก์ — จำกัดเฉพาะ http/https กัน javascript: URL
                const a = document.createElement('a');
                let safeUrl = '#';
                try {
                    const url = new URL(content, window.location.href);
                    if (url.protocol === 'http:' || url.protocol === 'https:') safeUrl = content;
                } catch (e) { /* invalid URL, keep '#' */ }
                a.href = safeUrl;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                a.textContent = content;
                wrap.appendChild(a);
                break;
            }
            case 6: { // โมเดล 3 มิติ
                const modelViewer = document.createElement('model-viewer');
                modelViewer.setAttribute('src', content.replace('../', '/lms/'));
                modelViewer.setAttribute('alt', '3D model');
                modelViewer.setAttribute('auto-rotate', '');
                modelViewer.setAttribute('camera-controls', '');
                modelViewer.setAttribute('ar', '');
                modelViewer.style.width = '100%';
                modelViewer.style.height = '50vh';
                modelViewer.style.maxHeight = '400px';
                wrap.appendChild(modelViewer);
                break;
            }
            case 7: { // แบบทดสอบ
                const parts = (content || '').split('_');
                const examId = parts[0];
                const examName = parts.slice(1).join('_');

                const label = document.createElement('div');
                label.className = 'text-center mb-2 fw-medium';
                label.textContent = lang['exam'] + ' ' + examName;
                wrap.appendChild(label);

                const actionWrap = document.createElement('div');
                actionWrap.className = 'text-center';
                if (pageData.can_see_content) {
                    const btn = document.createElement('button');
                    btn.className = 'btn btn-outline-success rounded-pill px-4';
                    btn.textContent = lang['clickhere'];
                    btn.addEventListener('click', () => {
                        window.open(`examination.php?exam=${examId}&c=${pageData.courseid}&u=${unit.unit_id}`, '_blank');
                    });
                    actionWrap.appendChild(btn);
                } else {
                    actionWrap.textContent = lang['srynotreg'];
                }
                wrap.appendChild(actionWrap);
                break;
            }
            default:
                wrap.textContent = lang['unsupportedcontent'];
        }

        return wrap;
    }

    // ตารางเรียนแบบ CSS grid ตาม .calendar (style.html) — คอลัมน์ = วัน, แถว = ชั่วโมง
    // เดิมสร้างเป็น flex row ต่อวัน ใช้ class ผิด (.calender สะกดผิด, ของจริงคือ .calendar) และ
    // ตรรกะระบายช่องผิดเวลามีมากกว่า 1 คาบต่อวัน
    function renderCalendar(schedules, days) {
        const infoBox = document.getElementById('calendar-info');
        const calendarBox = document.getElementById('calendar');
        infoBox.innerHTML = '';
        calendarBox.innerHTML = '';
        calendarBox.className = 'calendar';

        schedules.forEach(sc => {
            const day = days.find(d => d.id == sc.day_id);
            if (!day) return;
            const line = document.createElement('div');
            line.className = 'small';
            line.textContent = `${lang[day.name] || day.name} : ${sc.start_time} - ${sc.end_time}`;
            infoBox.appendChild(line);
        });

        const timeHeader = document.createElement('div');
        timeHeader.className = 'day-header';
        timeHeader.textContent = lang['time'];
        calendarBox.appendChild(timeHeader);

        days.forEach(day => {
            const dh = document.createElement('div');
            dh.className = 'day-header';
            dh.textContent = day.short_name || day.name;
            calendarBox.appendChild(dh);
        });

        const hours = [];
        for (let h = 8; h <= 20; h++) hours.push(h.toString().padStart(2, '0') + ':00');

        hours.forEach(hour => {
            const hourLabel = document.createElement('div');
            hourLabel.className = 'day-header';
            hourLabel.style.fontSize = '11px';
            hourLabel.textContent = hour;
            calendarBox.appendChild(hourLabel);

            days.forEach(day => {
                const cell = document.createElement('div');
                cell.className = 'time-slot';
                // เช็คทุก schedule ของวันนี้อิสระต่อกัน กันบั๊กเดิมที่คาบที่ 2 ในวันเดียวกันระบายผิด
                const isBusy = schedules.some(sc => sc.day_id == day.id && hour >= sc.start_time && hour < sc.end_time);
                if (isBusy) cell.classList.add('event');
                calendarBox.appendChild(cell);
            });
        });
    }

    let allMembers = [];

    function renderMembers(members) {
        allMembers = members;
        document.getElementById('member-count').textContent = members.length;

        const preview = document.getElementById('member-preview');
        preview.innerHTML = '';
        members.slice(0, 3).forEach(m => {
            const line = document.createElement('div');
            line.className = 'small';
            line.textContent = '- ' + m.name;
            preview.appendChild(line);
        });

        renderMemberTable(members);
    }

    function filterMembers() {
        const query = document.getElementById('search_box').value.trim().toLowerCase();
        const filtered = !query ? allMembers : allMembers.filter(m =>
            (m.name || '').toLowerCase().includes(query) || (m.code || '').toLowerCase().includes(query)
        );
        renderMemberTable(filtered);
    }

    function renderMemberTable(members) {
        const table = document.getElementById('table_user');
        if (!table) return;
        const tbody = table.getElementsByTagName('tbody')[0];
        tbody.innerHTML = '';

        if (members.length === 0) {
            const row = tbody.insertRow();
            const cell = row.insertCell(0);
            cell.colSpan = 4;
            cell.className = 'text-center text-muted py-3';
            cell.textContent = allMembers.length === 0 ? lang['nomember'] : lang['nomatchstudent'];
            return;
        }

        members.forEach(user => {
            const row = tbody.insertRow();
            row.insertCell(0).textContent = user.name;
            row.insertCell(1).textContent = user.code;
            row.insertCell(2).textContent = user.is_admin == 1 ? lang['roleadmin'] : lang['rolestudent'];

            const actionCell = row.insertCell(3);
            const btn = document.createElement('button');
            btn.className = 'btn btn-sm btn-outline-danger';
            btn.innerHTML = '<i class="bi bi-person-dash"></i> ' + lang['removestudent'];
            // ผูก event ด้วย addEventListener แทนการฝัง onclick string จากชื่อผู้ใช้ดิบๆ
            // (เดิม `onclick="openDeleteUserModal(${id},'${name}')"` แก้ JS ได้ถ้าชื่อมี ' อยู่)
            btn.addEventListener('click', () => openRemoveStudentModal(user.user_id, user.name));
            actionCell.appendChild(btn);
        });
    }

    function openRemoveStudentModal(ownerId, name) {
        removeStudentTarget = { owner_id: ownerId, name };
        document.getElementById('removeStudentName').textContent = name;
        new bootstrap.Modal(document.getElementById('removeStudentModal')).show();
    }

    async function confirmRemoveStudent() {
        if (!removeStudentTarget) return;
        try {
            const formData = new FormData();
            formData.append('course_id', pageData.courseid);
            formData.append('owner_id', removeStudentTarget.owner_id);

            const res = await fetch('../config/course_student_remove.php', { method: 'POST', body: formData });
            const result = await res.json();

            bootstrap.Modal.getInstance(document.getElementById('removeStudentModal'))?.hide();

            if (result.success) {
                showNotify(lang['studentremoved']);
                const res2 = await fetch(`../config/Fetch_usercourse.php?courseid=${pageData.courseid}`);
                const membersRes = await res2.json();
                renderMembers(Array.isArray(membersRes.users) ? membersRes.users : []);
            } else {
                showNotify(lang['loadfailed']);
            }
        } catch (error) {
            console.error('Remove student failed:', error);
            showNotify(lang['loadfailed']);
        } finally {
            removeStudentTarget = null;
        }
    }
</script>
