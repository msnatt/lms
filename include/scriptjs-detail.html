<!-- page product -->
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<script>
    const langData = document.getElementById('lang-data').textContent;
    const lang = JSON.parse(langData);

    const courseID = window.COURSE_ID;
    const currentUserId = window.CURRENT_USER_ID;
    const isAdminUser = !!window.IS_ADMIN;
    const ownerNameFallback = window.OWNER_NAME || '';

    const HOURS = ["08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00"];
    const TABS = ['content', 'info', 'schedule', 'members'];

    let courseData = null;
    let myCourses = [];
    let units = [];
    let contents = [];
    let courseUsers = [];
    let schedules = [];
    let days = [];
    let faculties = [];
    let departments = [];
    let contentDataMap = {};
    let isRegistered = false;

    let memberModalInstance = null;
    let confirmRemoveModalInstance = null;
    let pendingRemoveUserId = null;

    // กัน XSS: escape ทุกค่าที่มาจากฐานข้อมูล/ผู้ใช้ก่อนแทรกด้วย innerHTML
    function esc(str) {
        return String(str ?? '').replace(/[&<>"']/g, (c) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function emptyStateHtml(text) {
        return `
            <div class="tw-text-center tw-text-slate-400 tw-py-10">
                <i class="bi bi-inbox tw-text-3xl tw-block tw-mb-2"></i>
                ${esc(text)}
            </div>
        `;
    }

    function skeletonHtml() {
        const card = `
            <div class="tw-bg-white tw-rounded-xl tw-shadow tw-p-4 tw-animate-pulse">
                <div class="tw-h-4 tw-bg-slate-200 tw-rounded tw-w-1/3 tw-mb-2"></div>
                <div class="tw-h-3 tw-bg-slate-200 tw-rounded tw-w-2/3"></div>
            </div>
        `;
        return `<div class="tw-flex tw-flex-col tw-gap-3">${card.repeat(3)}</div>`;
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('panel-content').innerHTML = skeletonHtml();
        loadAll();

        document.getElementById('tab-bar').addEventListener('click', onTabClick);
        window.addEventListener('hashchange', () => activateTab(location.hash.slice(1)));

        document.getElementById('member-search').addEventListener('input', (e) => renderMemberTable(e.target.value));
        document.getElementById('member-table-body').addEventListener('click', onMemberTableClick);
        document.getElementById('confirm-remove-btn').addEventListener('click', onConfirmRemove);
    });

    async function loadAll() {
        showLoading();
        try {
            const [
                courseRes, myCourseRes, unitRes, contentRes,
                usersRes, scheduleRes, daysRes, facultyRes, departmentRes
            ] = await Promise.all([
                fetch(`../config/Find_CourseAll.php?courseid=${encodeURIComponent(courseID)}`),
                fetch(`../config/Fetch_MyCourse.php?user_id=${encodeURIComponent(currentUserId ?? '')}`),
                fetch(`../config/Fetch_Unit.php?course_id=${encodeURIComponent(courseID)}`),
                fetch(`../config/Fetch_content.php?course_id=${encodeURIComponent(courseID)}`),
                fetch(`../config/Fetch_usercourse.php?courseid=${encodeURIComponent(courseID)}`),
                fetch(`../config/Fetch_schedule.php?course_id=${encodeURIComponent(courseID)}`),
                fetch('../config/Fetch_days.php'),
                fetch('../config/Fetch_facultyall.php'),
                fetch('../config/Fetch_departmentall.php'),
            ]);

            if (!courseRes.ok || !myCourseRes.ok || !unitRes.ok || !contentRes.ok || !usersRes.ok) {
                throw new Error('response not ok');
            }

            const courseJson = await courseRes.json();
            const myCourseJson = await myCourseRes.json();
            const unitJson = await unitRes.json();
            const contentJson = await contentRes.json();
            const usersJson = await usersRes.json();
            const scheduleJson = scheduleRes.ok ? await scheduleRes.json() : [];
            const daysJson = daysRes.ok ? await daysRes.json() : [];
            const facultyJson = facultyRes.ok ? await facultyRes.json() : [];
            const departmentJson = departmentRes.ok ? await departmentRes.json() : [];

            courseData = Array.isArray(courseJson) && courseJson.length ? courseJson[0] : null;

            // Fetch_MyCourse.php คืน object {courses:[…]} ปกติ แต่คืน [] (array ว่าง) ถ้าไม่มีข้อมูลเลย
            myCourses = Array.isArray(myCourseJson) ? [] : (myCourseJson.courses || []);

            units = Array.isArray(unitJson) ? unitJson : [];
            contents = Array.isArray(contentJson) ? contentJson : [];
            courseUsers = (usersJson && Array.isArray(usersJson.users)) ? usersJson.users : [];
            schedules = Array.isArray(scheduleJson) ? scheduleJson : [];
            days = (Array.isArray(daysJson) ? daysJson : []).filter(d => Number(d.is_deleted) !== 1);
            faculties = Array.isArray(facultyJson) ? facultyJson : [];
            departments = Array.isArray(departmentJson) ? departmentJson : [];

            isRegistered = myCourses.some(c => String(c.course_id) === String(courseID));

            if (!courseData) {
                renderNotFound();
                return;
            }

            buildContentDataMap();
            renderHero();
            renderContentPanel();
            renderInfoPanel();
            renderSchedulePanel();
            renderMembersPanel();
            activateTab((location.hash || '').replace('#', '') || 'content');
        } catch (err) {
            console.error(err);
            renderLoadError();
        } finally {
            hideLoading();
        }
    }

    // เก็บโครงสร้าง { [unitId]: [{courseid, unitid, contentid, type, content}, ...] }
    // ต้องคงรูปแบบนี้ไว้เป๊ะ ๆ เพราะ config/mycourse_create.php อ่าน type == "7" เพื่อสร้างแถว course_points ตอนลงทะเบียน
    function buildContentDataMap() {
        contentDataMap = {};
        units.forEach(unit => {
            contentDataMap[String(unit.id)] = contents
                .filter(c => String(c.unit_id) === String(unit.id))
                .map(c => ({
                    courseid: unit.course_id,
                    unitid: unit.id,
                    contentid: c.id,
                    type: c.type_id,
                    content: c.content
                }));
        });
    }

    // ---------- TABS ----------
    function onTabClick(e) {
        const btn = e.target.closest('.detail-tab-btn');
        if (!btn) return;
        location.hash = btn.dataset.tab;
        activateTab(btn.dataset.tab);
    }

    function activateTab(tab) {
        if (!TABS.includes(tab)) tab = 'content';
        TABS.forEach(t => {
            const panel = document.getElementById('panel-' + t);
            if (panel) panel.hidden = t !== tab;

            const btn = document.querySelector(`.detail-tab-btn[data-tab="${t}"]`);
            if (!btn) return;
            if (t === tab) {
                btn.classList.add('tw-border-brand', 'tw-text-brand', 'tw-font-semibold');
                btn.classList.remove('tw-border-transparent', 'tw-text-slate-500', 'tw-font-medium');
                btn.setAttribute('aria-selected', 'true');
            } else {
                btn.classList.remove('tw-border-brand', 'tw-text-brand', 'tw-font-semibold');
                btn.classList.add('tw-border-transparent', 'tw-text-slate-500', 'tw-font-medium');
                btn.setAttribute('aria-selected', 'false');
            }
        });
    }

    // ---------- HERO ----------
    function renderHero() {
        const heroImg = document.getElementById('hero-image');
        heroImg.src = `../assets/images/bg_cards/${encodeURIComponent(courseData.image_code || '1.png')}`;
        heroImg.alt = courseData.name || '';
        heroImg.onerror = () => { heroImg.onerror = null; heroImg.src = '../assets/images/bg_cards/1.png'; };

        const titlePrefix = courseData.code ? `${courseData.code} · ` : '';
        document.getElementById('hero-title').textContent = `${titlePrefix}${courseData.name || ''}`;
        document.getElementById('hero-desc').textContent = courseData.description || '';

        const memberCount = courseUsers.length;
        const unitCount = units.length;

        document.getElementById('hero-meta').innerHTML = `
            <span><i class="bi bi-person-fill"></i> ${esc(lang['createby'])} ${esc(ownerNameFallback || '-')}</span>
            <span><i class="bi bi-people-fill"></i> ${memberCount} ${esc(lang['memberc'])}</span>
            <span><i class="bi bi-journal-bookmark-fill"></i> ${unitCount} ${esc(lang['unitcount'])}</span>
        `;

        renderHeroCta();
    }

    function renderHeroCta() {
        const cta = document.getElementById('hero-cta');
        if (isRegistered) {
            cta.innerHTML = `
                <span class="tw-inline-flex tw-items-center tw-gap-1 tw-bg-emerald-500 tw-text-white tw-rounded-full tw-px-4 tw-py-2 tw-text-sm tw-font-medium">
                    <i class="bi bi-check-circle-fill"></i> ${esc(lang['registered'])}
                </span>
            `;
            return;
        }
        cta.innerHTML = `
            <button type="button" id="register-btn" class="tw-bg-brand hover:tw-opacity-90 tw-text-white tw-border-0 tw-rounded-full tw-px-5 tw-py-2 tw-text-sm tw-font-medium">
                ${esc(lang['registerc'])}
            </button>
        `;
        const btn = document.getElementById('register-btn');
        if (btn) btn.addEventListener('click', onRegisterClick);
    }

    async function onRegisterClick() {
        const btn = document.getElementById('register-btn');
        if (!btn) return;
        btn.disabled = true;
        const originalText = btn.textContent;
        btn.textContent = lang['registering'];

        try {
            const formData = new FormData();
            formData.append('user_id', currentUserId);
            formData.append('create_by', courseData.create_by);
            formData.append('course_id', courseID);
            formData.append('data', JSON.stringify(contentDataMap));

            const res = await fetch('../config/mycourse_create.php', { method: 'POST', body: formData });
            const result = await res.json();
            if (!res.ok || result.status !== 'success') {
                throw new Error(result.message || 'register failed');
            }

            window.location.href = `detail.php?courseid=${encodeURIComponent(courseID)}${location.hash || ''}`;
        } catch (err) {
            console.error(err);
            showNotify(lang['registerfailed']);
            btn.disabled = false;
            btn.textContent = originalText;
        }
    }

    // ---------- CONTENT TAB ----------
    function renderContentPanel() {
        const panel = document.getElementById('panel-content');

        if (units.length === 0) {
            panel.innerHTML = emptyStateHtml(lang['nounit']);
            return;
        }

        const itemsHtml = units.map((unit, idx) => {
            const unitContents = contents.filter(c => String(c.unit_id) === String(unit.id));
            const bodyHtml = unitContents.length
                ? unitContents.map(c => renderContentItem(c, unit)).join('')
                : `<p class="tw-text-slate-400 tw-mb-0">${esc(lang['nounit'])}</p>`;

            const conclusionHtml = unit.conclusion ? `
                <div class="tw-mt-3 tw-pt-3 tw-border-t tw-border-slate-100">
                    <h6 class="tw-font-bold tw-mb-1">${esc(lang['conclusion'])}</h6>
                    <p class="tw-text-slate-600 tw-whitespace-pre-line tw-mb-0">${esc(unit.conclusion)}</p>
                </div>
            ` : '';

            return `
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button ${idx === 0 ? '' : 'collapsed'}" type="button" data-bs-toggle="collapse" data-bs-target="#unit-collapse-${unit.id}" aria-expanded="${idx === 0}" aria-controls="unit-collapse-${unit.id}">
                            <span class="badge rounded-pill tw-bg-brand tw-text-white tw-me-2">${idx + 1}</span>
                            <span class="tw-min-w-0">
                                <span class="tw-block tw-font-bold">${esc(unit.name)}</span>
                                ${unit.introduction ? `<span class="tw-block tw-text-slate-500" style="font-size:.85rem;">${esc(unit.introduction)}</span>` : ''}
                            </span>
                        </button>
                    </h2>
                    <div id="unit-collapse-${unit.id}" class="accordion-collapse collapse ${idx === 0 ? 'show' : ''}">
                        <div class="accordion-body">
                            ${bodyHtml}
                            ${conclusionHtml}
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        panel.innerHTML = `
            <div class="tw-flex tw-flex-wrap tw-items-center tw-justify-between tw-gap-2 tw-mb-4">
                <p class="tw-text-slate-500 tw-mb-0">${esc(lang['unitcount'])}: ${units.length}</p>
                <div class="tw-flex tw-gap-2">
                    <button type="button" id="expand-all-btn" class="btn btn-sm btn-outline-secondary">${esc(lang['expandall'])}</button>
                    <button type="button" id="collapse-all-btn" class="btn btn-sm btn-outline-secondary">${esc(lang['collapseall'])}</button>
                </div>
            </div>
            <div class="accordion" id="unit-accordion">${itemsHtml}</div>
        `;

        document.getElementById('expand-all-btn').addEventListener('click', () => toggleAllUnits(true));
        document.getElementById('collapse-all-btn').addEventListener('click', () => toggleAllUnits(false));

        panel.querySelectorAll('[data-lazy-video]').forEach(setupLazyVideo);
    }

    function toggleAllUnits(expand) {
        document.querySelectorAll('#unit-accordion .accordion-collapse').forEach(el => {
            const collapse = bootstrap.Collapse.getOrCreateInstance(el, { toggle: false });
            if (expand) collapse.show(); else collapse.hide();
        });
    }

    function renderContentItem(content, unit) {
        const wrap = (inner) => `<div class="tw-mb-4">${inner}</div>`;

        switch (String(content.type_id)) {
            case '1': // Text
                return wrap(`<p class="tw-whitespace-pre-line tw-text-slate-700 tw-mb-0">${esc(content.content)}</p>`);

            case '2': // Image
                return wrap(`<img src="${esc(content.content)}" alt="" class="tw-w-full tw-max-w-md tw-rounded-lg" loading="lazy">`);

            case '3': // Video (โหลด iframe เฉพาะตอนเลื่อนมาเห็น)
                return wrap(`<div class="tw-w-full tw-max-w-md tw-rounded-lg" data-lazy-video data-src="${esc(content.content)}" style="aspect-ratio:16/9; background:#f1f5f9;"></div>`);

            case '4': // PDF
                return wrap(`<embed src="${esc(content.content)}" type="application/pdf" class="tw-w-full tw-rounded-lg" style="height:500px;">`);

            case '5': // ลิงก์
                return wrap(`<a href="${esc(content.content)}" target="_blank" rel="noopener" class="tw-text-brand">${esc(content.content)} <i class="bi bi-box-arrow-up-right"></i></a>`);

            case '6': { // 3D model
                const publicPath = String(content.content || '').replace('../', '/lms/');
                return wrap(`
                    <div class="tw-flex tw-justify-center">
                        <model-viewer src="${esc(publicPath)}" alt="3D model" auto-rotate camera-controls ar style="width:100%; max-width:500px; height:50vh; max-height:400px;"></model-viewer>
                    </div>
                `);
            }

            case '7': { // ข้อสอบ
                const parts = String(content.content || '').split('_');
                const examId = parts[0];
                const examName = parts.slice(1).join('_');
                const buttonHtml = isRegistered
                    ? `<button type="button" class="btn tw-bg-brand tw-text-white tw-border-0 tw-rounded-full tw-px-4" onclick="window.open('examination.php?exam=${encodeURIComponent(examId)}&c=${encodeURIComponent(courseID)}&u=${encodeURIComponent(unit.id)}', '_blank')">${esc(lang['clickhere'])}</button>`
                    : `<span class="tw-text-slate-500">${esc(lang['srynotreg'])}</span>`;

                return wrap(`
                    <div class="tw-text-center tw-bg-slate-50 tw-rounded-lg tw-p-3">
                        <div class="tw-font-medium tw-mb-2">${esc(lang['exam'])} ${esc(examName)}</div>
                        ${buttonHtml}
                    </div>
                `);
            }

            default:
                return wrap(`<p class="tw-text-slate-400 tw-mb-0">Unsupported content type</p>`);
        }
    }

    function setupLazyVideo(el) {
        const rawSrc = el.getAttribute('data-src') || '';
        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (!entry.isIntersecting) return;

                let finalSrc = rawSrc;
                try {
                    const u = new URL(rawSrc, window.location.href);
                    u.searchParams.set('autoplay', '0');
                    u.searchParams.set('mute', '1');
                    finalSrc = u.toString();
                } catch (e) {
                    // rawSrc ไม่ใช่ URL ที่ถูกต้อง ใช้ค่าดิบไปตามเดิม
                }

                el.innerHTML = `
                    <iframe
                        src="${esc(finalSrc)}"
                        title="Course video"
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen
                        style="width:100%; height:100%; border-radius: .5rem;">
                    </iframe>
                `;
                observer.disconnect();
            });
        });
        observer.observe(el);
    }

    // ---------- INFO TAB ----------
    function renderInfoPanel() {
        const panel = document.getElementById('panel-info');
        const faculty = faculties.find(f => String(f.id) === String(courseData.faculty_id));
        const department = departments.find(d => String(d.id) === String(courseData.department_id));

        panel.innerHTML = `
            <div class="tw-grid tw-grid-cols-1 md:tw-grid-cols-2 tw-gap-4">
                <div class="tw-bg-white tw-rounded-xl tw-shadow tw-p-4">
                    <h3 class="tw-font-bold tw-text-base tw-mb-2">${esc(lang['obj'])}</h3>
                    <div class="tw-whitespace-pre-line tw-text-slate-700">${esc(courseData.objective || '-')}</div>
                </div>
                <div class="tw-bg-white tw-rounded-xl tw-shadow tw-p-4">
                    <h3 class="tw-font-bold tw-text-base tw-mb-2">${esc(lang['description'])}</h3>
                    <div class="tw-whitespace-pre-line tw-text-slate-700">${esc(courseData.description || '-')}</div>
                </div>
                <div class="tw-bg-white tw-rounded-xl tw-shadow tw-p-4 md:tw-col-span-2">
                    <dl class="tw-grid tw-grid-cols-2 sm:tw-grid-cols-4 tw-gap-3 tw-text-sm tw-mb-0">
                        <div><dt class="tw-text-slate-400">${esc(lang['code'])}</dt><dd class="tw-font-medium">${esc(courseData.code || '-')}</dd></div>
                        <div><dt class="tw-text-slate-400">${esc(lang['createby'])}</dt><dd class="tw-font-medium">${esc(ownerNameFallback || '-')}</dd></div>
                        <div><dt class="tw-text-slate-400">${esc(lang['faculty'])}</dt><dd class="tw-font-medium">${esc(faculty ? faculty.name : '-')}</dd></div>
                        <div><dt class="tw-text-slate-400">${esc(lang['department'])}</dt><dd class="tw-font-medium">${esc(department ? department.name : '-')}</dd></div>
                    </dl>
                </div>
            </div>
        `;
    }

    // ---------- SCHEDULE TAB ----------
    function renderSchedulePanel() {
        const panel = document.getElementById('panel-schedule');

        if (!schedules.length) {
            panel.innerHTML = `
                <div class="tw-bg-white tw-rounded-xl tw-shadow tw-p-4">
                    <h3 class="tw-font-bold tw-text-base tw-mb-3">${esc(lang['timetable'])}</h3>
                    ${emptyStateHtml(lang['noschedule'])}
                </div>
            `;
            return;
        }

        const summaryHtml = schedules.map(sc => {
            const day = days.find(d => String(d.id) === String(sc.day_id));
            const dayLabel = day ? (lang[day.name] || day.short_name) : '';
            return `
                <span class="tw-inline-flex tw-items-center tw-gap-1 tw-bg-slate-50 tw-rounded-full tw-px-3 tw-py-1 tw-text-sm tw-me-2 tw-mb-2">
                    <i class="bi bi-clock"></i> ${esc(dayLabel)} ${esc(sc.start_time)} - ${esc(sc.end_time)}
                </span>
            `;
        }).join('');

        const headerCells = HOURS.map(h => `<th class="tw-border tw-border-slate-200 tw-px-1 tw-py-2 tw-font-normal tw-text-slate-500" style="min-width:44px;">${h}</th>`).join('');

        const rows = days.map(day => {
            const cells = HOURS.map(h => {
                // ช่วงเวลาเป็นสตริง HH:MM 24 ชม. เทียบแบบ lexicographic ได้ตรงกับตัวเลขจริง
                const match = schedules.find(sc => String(sc.day_id) === String(day.id) && h >= sc.start_time && h < sc.end_time);
                const title = match ? `${lang[day.name] || day.short_name} ${match.start_time}-${match.end_time}` : '';
                return `<td class="tw-border tw-border-slate-200 tw-h-8 ${match ? 'tw-bg-brand' : ''}" title="${esc(title)}"></td>`;
            }).join('');
            return `
                <tr>
                    <td class="tw-sticky tw-left-0 tw-bg-white tw-border tw-border-slate-200 tw-px-2 tw-py-1 tw-font-medium tw-whitespace-nowrap">${esc(lang[day.name] || day.short_name)}</td>
                    ${cells}
                </tr>
            `;
        }).join('');

        panel.innerHTML = `
            <div class="tw-bg-white tw-rounded-xl tw-shadow tw-p-4">
                <h3 class="tw-font-bold tw-text-base tw-mb-3">${esc(lang['timetable'])}</h3>
                <div class="tw-mb-3">${summaryHtml}</div>
                <div class="tw-overflow-x-auto">
                    <table class="tw-border-collapse tw-text-xs md:tw-text-sm" style="min-width:700px;">
                        <thead>
                            <tr>
                                <th class="tw-sticky tw-left-0 tw-bg-white tw-border tw-border-slate-200 tw-px-2 tw-py-2" style="min-width:70px;"></th>
                                ${headerCells}
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            </div>
        `;
    }

    // ---------- MEMBERS TAB ----------
    function renderMembersPanel() {
        const panel = document.getElementById('panel-members');
        const cardsHtml = courseUsers.length
            ? `<div class="tw-grid tw-grid-cols-1 sm:tw-grid-cols-2 lg:tw-grid-cols-3 tw-gap-3">${courseUsers.map(renderMemberCard).join('')}</div>`
            : emptyStateHtml(lang['nomember']);

        panel.innerHTML = `
            <div class="tw-flex tw-flex-wrap tw-items-center tw-justify-between tw-gap-2 tw-mb-4">
                <p class="tw-text-slate-500 tw-mb-0">${esc(lang['allmember'])}: ${courseUsers.length}</p>
                ${isAdminUser ? `<button type="button" id="open-member-modal-btn" class="btn btn-sm tw-bg-brand tw-text-white tw-border-0"><i class="bi bi-gear"></i> ${esc(lang['managemember'])}</button>` : ''}
            </div>
            ${cardsHtml}
        `;

        const openBtn = document.getElementById('open-member-modal-btn');
        if (openBtn) openBtn.addEventListener('click', openMemberModal);
    }

    function renderMemberCard(user) {
        const initial = String(user.name || '?').trim().charAt(0).toUpperCase() || '?';
        const roleLabel = Number(user.is_admin) === 1 ? lang['roleadmin'] : lang['rolestudent'];
        return `
            <div class="tw-bg-white tw-rounded-xl tw-shadow tw-p-3 tw-flex tw-items-center tw-gap-3">
                <div class="tw-w-10 tw-h-10 tw-rounded-full tw-bg-brand tw-text-white tw-flex tw-items-center tw-justify-center tw-font-bold tw-flex-shrink-0">${esc(initial)}</div>
                <div class="tw-min-w-0">
                    <div class="tw-font-medium tw-truncate">${esc(user.name)}</div>
                    <div class="tw-text-xs tw-text-slate-500">${esc(roleLabel)}</div>
                </div>
            </div>
        `;
    }

    // ---------- MEMBER MANAGEMENT MODAL ----------
    function openMemberModal() {
        document.getElementById('member-search').value = '';
        renderMemberTable('');
        memberModalInstance = memberModalInstance || new bootstrap.Modal(document.getElementById('member-modal'));
        memberModalInstance.show();
    }

    function renderMemberTable(filterText) {
        const tbody = document.getElementById('member-table-body');
        const term = (filterText || '').trim().toLowerCase();
        const filtered = courseUsers.filter(u =>
            !term ||
            String(u.name || '').toLowerCase().includes(term) ||
            String(u.code || '').toLowerCase().includes(term)
        );

        if (!filtered.length) {
            tbody.innerHTML = `<tr><td colspan="4" class="tw-text-center tw-text-slate-400 tw-py-4">${esc(lang['nomember'])}</td></tr>`;
            return;
        }

        tbody.innerHTML = filtered.map(u => `
            <tr>
                <td>${esc(u.name)}</td>
                <td>${esc(u.code)}</td>
                <td>${Number(u.is_admin) === 1 ? esc(lang['roleadmin']) : esc(lang['rolestudent'])}</td>
                <td class="tw-text-end">
                    <button type="button" class="btn btn-sm btn-outline-danger remove-member-btn" data-user-id="${esc(u.user_id)}" data-user-name="${esc(u.name)}">
                        <i class="bi bi-x-circle"></i> ${esc(lang['removemember'])}
                    </button>
                </td>
            </tr>
        `).join('');
    }

    function onMemberTableClick(e) {
        const btn = e.target.closest('.remove-member-btn');
        if (!btn) return;
        pendingRemoveUserId = btn.dataset.userId;
        document.getElementById('remove-member-name').textContent = btn.dataset.userName || '';
        confirmRemoveModalInstance = confirmRemoveModalInstance || new bootstrap.Modal(document.getElementById('confirm-remove-modal'));
        confirmRemoveModalInstance.show();
    }

    // ถอนสมาชิกออกจากคอร์สนี้เท่านั้น (soft-delete แถว course_student) — ไม่ใช่การลบบัญชีผู้ใช้
    async function onConfirmRemove() {
        if (!pendingRemoveUserId) return;
        const userId = pendingRemoveUserId;
        const btn = document.getElementById('confirm-remove-btn');
        btn.disabled = true;

        try {
            const formData = new FormData();
            formData.append('type', 'student');
            formData.append('action', 'remove');
            formData.append('course_id', courseID);
            formData.append('user_ids', JSON.stringify([Number(userId)]));

            const res = await fetch('../config/course_enroll.php', { method: 'POST', body: formData });
            const result = await res.json();
            if (!res.ok || !result.success) {
                throw new Error(result.message || 'remove failed');
            }

            courseUsers = courseUsers.filter(u => String(u.user_id) !== String(userId));
            renderMemberTable(document.getElementById('member-search').value);
            renderMembersPanel();
            renderHero();
            showNotify(lang['removesuccess']);
        } catch (err) {
            console.error(err);
            showNotify(lang['loadfailed']);
        } finally {
            btn.disabled = false;
            pendingRemoveUserId = null;
            if (confirmRemoveModalInstance) confirmRemoveModalInstance.hide();
        }
    }

    // ---------- EMPTY / ERROR STATES ----------
    function renderNotFound() {
        document.getElementById('hero').style.display = 'none';
        const tabBarWrapper = document.getElementById('tab-bar-wrapper');
        if (tabBarWrapper) tabBarWrapper.style.display = 'none';

        const panel = document.getElementById('panel-content');
        panel.hidden = false;
        panel.innerHTML = `
            <div class="tw-text-center tw-text-slate-500 tw-py-20">
                <i class="bi bi-emoji-frown tw-text-4xl tw-block tw-mb-3"></i>
                <div class="tw-mb-3">${esc(lang['nocoursefound'])}</div>
                <a href="course.php" class="btn tw-bg-brand tw-text-white tw-border-0">${esc(lang['back'])}</a>
            </div>
        `;
        ['panel-info', 'panel-schedule', 'panel-members'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.hidden = true;
        });
    }

    function renderLoadError() {
        const panel = document.getElementById('panel-content');
        panel.hidden = false;
        panel.innerHTML = `
            <div class="tw-text-center tw-text-slate-500 tw-py-16">
                <i class="bi bi-exclamation-triangle tw-text-4xl tw-block tw-mb-2"></i>
                ${esc(lang['loadfailed'])}
                <div class="tw-mt-3">
                    <button type="button" id="retry-load-btn" class="btn tw-bg-brand tw-text-white tw-border-0">${esc(lang['tryagain'])}</button>
                </div>
            </div>
        `;
        const retryBtn = document.getElementById('retry-load-btn');
        if (retryBtn) retryBtn.addEventListener('click', loadAll);
    }
</script>
