<!-- Home profile / homepage content management -->
<script>
    const LANG_INFO = {
        selectImageFirst: <?= json_encode($lang['selectimagefirst'], JSON_UNESCAPED_UNICODE) ?>,
        uploadFailed: <?= json_encode($lang['uploadfailed'], JSON_UNESCAPED_UNICODE) ?>,
    };

    document.addEventListener('DOMContentLoaded', async () => {
        await refresh();
    });

    function renderYoutube(id) {
        const el = document.getElementById('youtube-video');
        if (!el) return;
        id = (id || '').trim();
        el.innerHTML = id ?
            `<iframe src="https://www.youtube.com/embed/${encodeURIComponent(id)}"
                title="YouTube preview" frameborder="0" allowfullscreen
                style="width:100%;height:100%;border:0;border-radius:var(--radius-md);"></iframe>` :
            '';
    }

    async function generateOptionList(json) {
        fetch('../config/get_image.php')
            .then(response => response.json())
            .then(files => {
                const stat = document.getElementById('stat-images');
                if (stat) stat.textContent = files.length;

                Object.entries(json).forEach(([key, value]) => {
                    if (key == 'id') {
                        return
                    }
                    if (key !== 'youtube_id') {
                        let container = document.getElementById('select-' + key);
                        if (!container) return;
                        files.forEach(filename => {
                            const option = document.createElement('option');
                            option.value = filename;
                            option.textContent = filename;
                            option.selected = filename === value ? true : '';
                            container.appendChild(option);
                        });
                        container.addEventListener("change", () => {
                            const img = document.getElementById('img_' + key);
                            img.setAttribute('src', "../assets/images/home/" + container.value);
                        });
                    } else {
                        let ele = document.getElementById('youtube_id');
                        if (!ele) return;
                        ele.value = value;
                        ele.addEventListener('input', () => renderYoutube(ele.value));
                    }
                })
            })
            .catch(error => console.error('Error loading images:', error));

    }

    async function refresh() {

        let response = await fetch("../config/Fetch_homeprofile.php");
        let json = await response.json();
        json = json[0];

        generateOptionList(json);
        Object.entries(json).forEach(([key, value]) => {
            if (key === 'id' || key === 'youtube_id') return;
            const element = document.getElementById('img_' + key);
            if (!element) return;
            element.setAttribute('src', "../assets/images/home/" + value);
        });

        renderYoutube(json['youtube_id']);

    }

    const imageInput = document.getElementById('imageInput');
    const preview = document.getElementById('preview');
    const imgPreview = document.getElementById('img-preview');
    const newname = document.getElementById('btn-save');

    imageInput.addEventListener('change', function () {
        const file = this.files[0];
        if (file) {
            imgPreview.src = URL.createObjectURL(file);
            preview.style.display = 'block';
            newname.style.display = 'block';
        }
    });

    function saveto() {
        const fileInput = document.getElementById('imageInput');
        const file = fileInput.files[0];
        if (!file) {
            showNotify(LANG_INFO.selectImageFirst);
            return;
        }

        const formData = new FormData();
        formData.append("image", file);

        fetch("../config/upload-profile.php", {
            method: "POST",
            body: formData
        })
            .then(response => response.text())
            .then(result => {
                window.location.reload();
            })
            .catch(error => {
                console.error("upload error : ", error);
                showNotify(LANG_INFO.uploadFailed);
            });
    }

    document.getElementById('manageimage').addEventListener("click", () => {
        const managebox = document.getElementById('managebox');
        managebox.classList.toggle('show'); // toggle class ที่เลื่อนกล่องเข้า/ออก

    });
</script>
