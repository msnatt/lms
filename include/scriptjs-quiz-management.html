<!-- page quiz-management (EMS) -->
<script>
    const qmsLang = JSON.parse(document.getElementById('lang-data').textContent);

    let allExams = [];
    let qIndex = 0;               // running id for question blocks in the create form
    let deleteTargetId = null;

    const TYPE_LABEL = {
        'pre-test': qmsLang['pretest'],
        'post-test': qmsLang['posttest'],
        'quiz': qmsLang['quizlabel'],
    };
    const TYPE_BADGE = {
        'pre-test': 'tw-bg-sky-100 tw-text-brand',
        'post-test': 'tw-bg-amber-100 tw-text-amber-700',
        'quiz': 'tw-bg-violet-100 tw-text-violet-700',
    };

    const els = {
        search: document.getElementById('search-exam'),
        filterType: document.getElementById('filter-type'),
        sortBy: document.getElementById('sort-by'),
        btnCreate: document.getElementById('btn-create'),
        total: document.getElementById('exam-total'),
        tbody: document.querySelector('#table_exam tbody'),
        tableWrap: document.getElementById('table-wrap'),
        emptyState: document.getElementById('empty-state'),
        errorState: document.getElementById('error-state'),
        retryBtn: document.getElementById('retry-btn'),
        // create modal
        createModalEl: document.getElementById('createModal'),
        createForm: document.getElementById('createForm'),
        fTitle: document.getElementById('f-title'),
        fStart: document.getElementById('f-start'),
        fPeriod: document.getElementById('f-period'),
        fDesc: document.getElementById('f-desc'),
        questionList: document.getElementById('question-list'),
        btnAddQuestion: document.getElementById('btn-add-question'),
        createAlert: document.getElementById('create-alert'),
        createSubmit: document.getElementById('create-submit'),
        // detail modal
        detailModalEl: document.getElementById('detailModal'),
        detailTitle: document.getElementById('detail-title'),
        detailMeta: document.getElementById('detail-meta'),
        detailQuestions: document.getElementById('detail-questions'),
        // delete modal
        deleteModalEl: document.getElementById('deleteModal'),
        deleteExamName: document.getElementById('delete-exam-name'),
        confirmDeleteBtn: document.getElementById('confirm-delete-btn'),
    };

    let createModal, detailModal, deleteModal;

    function esc(value) {
        return String(value ?? '').replace(/[&<>"']/g, (c) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function showState(which) {
        els.tableWrap.classList.toggle('tw-hidden', which !== 'table');
        els.emptyState.classList.toggle('tw-hidden', which !== 'empty');
        els.emptyState.classList.toggle('tw-flex', which === 'empty');
        els.errorState.classList.toggle('tw-hidden', which !== 'error');
        els.errorState.classList.toggle('tw-flex', which === 'error');
    }

    document.addEventListener('DOMContentLoaded', () => {
        createModal = new bootstrap.Modal(els.createModalEl);
        detailModal = new bootstrap.Modal(els.detailModalEl);
        deleteModal = new bootstrap.Modal(els.deleteModalEl);

        loadExams();

        els.search.addEventListener('input', renderTable);
        els.filterType.addEventListener('change', renderTable);
        els.sortBy.addEventListener('change', renderTable);
        els.retryBtn.addEventListener('click', loadExams);

        els.btnCreate.addEventListener('click', openCreateModal);
        els.btnAddQuestion.addEventListener('click', () => addQuestion());
        els.createSubmit.addEventListener('click', submitCreate);
        els.confirmDeleteBtn.addEventListener('click', confirmDelete);

        // row actions via delegation
        els.tbody.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-action]');
            if (!btn) return;
            const id = btn.dataset.id;
            const exam = allExams.find(x => String(x.id) === String(id));
            if (!exam) return;
            if (btn.dataset.action === 'view') openDetail(exam);
            else if (btn.dataset.action === 'delete') openDelete(exam);
        });

        // remove-question / add-choice / remove-choice inside the create form
        els.questionList.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-qaction]');
            if (!btn) return;
            const block = btn.closest('.q-block');
            if (btn.dataset.qaction === 'del-question') {
                block.remove();
                renumberQuestions();
            } else if (btn.dataset.qaction === 'add-choice') {
                addChoice(block.querySelector('.choice-list'));
            } else if (btn.dataset.qaction === 'del-choice') {
                btn.closest('.choice-row').remove();
            }
        });
    });

    // ---------- load + render ----------
    async function loadExams() {
        showLoading();
        try {
            const res = await fetch('../config/Fetch_question_sets.php');
            if (!res.ok) throw new Error('response not ok: ' + res.status);
            allExams = await res.json();
            if (!Array.isArray(allExams)) allExams = [];
            els.total.textContent = allExams.length;
            renderTable();
        } catch (err) {
            console.error('[qms] load failed', err);
            allExams = [];
            showState('error');
        } finally {
            hideLoading();
        }
    }

    function renderTable() {
        const term = els.search.value.trim().toLowerCase();
        const type = els.filterType.value;
        const sort = els.sortBy.value;

        let rows = allExams.filter(e => {
            if (type && e.type !== type) return false;
            if (term && !String(e.title ?? '').toLowerCase().includes(term)) return false;
            return true;
        });

        rows.sort((a, b) => {
            if (sort === 'title') return String(a.title ?? '').localeCompare(String(b.title ?? ''));
            const da = String(a.created_at ?? ''), db = String(b.created_at ?? '');
            return sort === 'oldest' ? da.localeCompare(db) : db.localeCompare(da);
        });

        if (rows.length === 0) {
            els.tbody.innerHTML = '';
            showState('empty');
            return;
        }
        showState('table');

        els.tbody.innerHTML = rows.map(e => {
            const badgeCls = TYPE_BADGE[e.type] || 'tw-bg-slate-100 tw-text-slate-500';
            const typeLbl = TYPE_LABEL[e.type] || e.type;
            return `
                <tr>
                    <td>${esc(e.title)}</td>
                    <td><span class="tw-text-xs tw-px-2 tw-py-0.5 tw-rounded-full ${badgeCls}">${esc(typeLbl)}</span></td>
                    <td>${esc(e.start_time)}</td>
                    <td>${esc(e.exam_period)}</td>
                    <td>${esc(e.question_count ?? 0)}</td>
                    <td>${esc(e.created_at)}</td>
                    <td>
                        <div class="tw-flex tw-gap-1 tw-justify-end">
                            <button type="button" data-action="view" data-id="${esc(e.id)}" title="${esc(qmsLang['viewdetail'])}"
                                class="tw-bg-slate-100 tw-text-slate-600 tw-border-0 tw-rounded-lg tw-px-2 tw-py-1 tw-text-sm hover:tw-bg-slate-200"><i class="bi bi-eye"></i></button>
                            <button type="button" data-action="delete" data-id="${esc(e.id)}" title="${esc(qmsLang['delete'])}"
                                class="tw-bg-red-50 tw-text-red-600 tw-border-0 tw-rounded-lg tw-px-2 tw-py-1 tw-text-sm hover:tw-bg-red-100"><i class="bi bi-trash3"></i></button>
                        </div>
                    </td>
                </tr>`;
        }).join('');
    }

    // ---------- create ----------
    function openCreateModal() {
        els.createForm.reset();
        els.createAlert.textContent = '';
        els.questionList.innerHTML = '';
        qIndex = 0;
        addQuestion();          // start with one question block
        createModal.show();
    }

    function addQuestion() {
        const id = qIndex++;
        const div = document.createElement('div');
        div.className = 'q-block';
        div.innerHTML = `
            <div class="tw-flex tw-items-center tw-justify-between tw-mb-2">
                <label class="form-label tw-m-0 tw-font-semibold">${esc(qmsLang['question'])} <span class="q-num"></span></label>
                <button type="button" data-qaction="del-question"
                    class="tw-bg-red-50 tw-text-red-600 tw-border-0 tw-rounded tw-px-2 tw-py-0.5 tw-text-sm hover:tw-bg-red-100"><i class="bi bi-x-lg"></i></button>
            </div>
            <input type="text" class="form-control q-text tw-mb-2" required>
            <div class="choice-list tw-flex tw-flex-col tw-gap-2 tw-mb-2"></div>
            <button type="button" data-qaction="add-choice"
                class="tw-bg-slate-100 tw-text-slate-600 tw-border-0 tw-rounded-lg tw-px-3 tw-py-1 tw-text-sm hover:tw-bg-slate-200">
                <i class="bi bi-plus-square tw-mr-1"></i>${esc(qmsLang['addchoicebtn'])}
            </button>`;
        els.questionList.appendChild(div);
        const cl = div.querySelector('.choice-list');
        addChoice(cl);
        addChoice(cl);
        renumberQuestions();
    }

    function addChoice(choiceList) {
        const qBlock = choiceList.closest('.q-block');
        const groupName = 'correct-' + Array.from(els.questionList.children).indexOf(qBlock);
        const row = document.createElement('div');
        row.className = 'choice-row input-group';
        row.innerHTML = `
            <div class="input-group-text">
                <input class="form-check-input mt-0 choice-correct" type="radio" name="${groupName}">
            </div>
            <input type="text" class="form-control choice-text" required>
            <button type="button" data-qaction="del-choice" class="btn btn-outline-secondary"><i class="bi bi-x"></i></button>`;
        choiceList.appendChild(row);
    }

    function renumberQuestions() {
        Array.from(els.questionList.children).forEach((block, i) => {
            const num = block.querySelector('.q-num');
            if (num) num.textContent = (i + 1);
            // keep radio group names aligned with position
            block.querySelectorAll('.choice-correct').forEach(r => { r.name = 'correct-' + i; });
        });
    }

    async function submitCreate() {
        els.createAlert.textContent = '';
        renumberQuestions();

        const title = els.fTitle.value.trim();
        const start = els.fStart.value;
        const period = els.fPeriod.value;
        const desc = els.fDesc.value.trim();
        const typeEl = els.createForm.querySelector('input[name="f-type"]:checked');

        if (!title || !start || !period || !desc || !typeEl) {
            els.createAlert.textContent = qmsLang['incomplete'] || qmsLang['fail-exam'];
            return;
        }

        const blocks = Array.from(els.questionList.children);
        if (blocks.length === 0) {
            els.createAlert.textContent = qmsLang['minonequestion'];
            return;
        }

        const fd = new FormData();
        fd.append('title', title);
        fd.append('startTime', start);
        fd.append('examPeriod', period);
        fd.append('description', desc);
        fd.append('type', typeEl.value);

        for (let i = 0; i < blocks.length; i++) {
            const block = blocks[i];
            const qtext = block.querySelector('.q-text').value.trim();
            const choiceRows = Array.from(block.querySelectorAll('.choice-row'));
            const texts = choiceRows.map(r => r.querySelector('.choice-text').value.trim()).filter(Boolean);
            const correctIdx = choiceRows.findIndex(r => r.querySelector('.choice-correct').checked);

            if (!qtext || texts.length < 2) {
                els.createAlert.textContent = qmsLang['mintwochoice'] + ' (#' + (i + 1) + ')';
                return;
            }
            if (correctIdx < 0 || correctIdx >= texts.length) {
                els.createAlert.textContent = qmsLang['pickcorrect'] + ' (#' + (i + 1) + ')';
                return;
            }
            fd.append(`questions[${i}][text]`, qtext);
            fd.append(`questions[${i}][correct]`, correctIdx);
            texts.forEach(t => fd.append(`questions[${i}][choices][]`, t));
        }

        showLoading();
        els.createSubmit.disabled = true;
        try {
            const res = await fetch('../config/exam_create.php', { method: 'POST', body: fd });
            const data = await res.json();
            if (data.success) {
                createModal.hide();
                showNotify(qmsLang['succ-exam']);
                await loadExams();
            } else {
                els.createAlert.textContent = qmsLang['fail-exam'] + ' (' + esc(data.message || '') + ')';
            }
        } catch (err) {
            console.error('[qms] create failed', err);
            els.createAlert.textContent = qmsLang['fail-exam'];
        } finally {
            hideLoading();
            els.createSubmit.disabled = false;
        }
    }

    // ---------- view detail ----------
    async function openDetail(exam) {
        els.detailTitle.textContent = '';
        els.detailMeta.textContent = '';
        els.detailQuestions.innerHTML = '';
        showLoading();
        try {
            const res = await fetch('../config/Fetch_ExamDetail.php?exam_id=' + encodeURIComponent(exam.id));
            if (!res.ok) throw new Error('response not ok: ' + res.status);
            const d = await res.json();
            if (!d.success) throw new Error(d.message || 'load failed');

            els.detailTitle.textContent = d.title;
            els.detailMeta.textContent =
                (TYPE_LABEL[d.type] || d.type) + ' · ' + d.start_time +
                ' · ' + d.exam_period + ' ' + qmsLang['minute'] +
                (d.description ? ' · ' + d.description : '');

            els.detailQuestions.innerHTML = (d.questions || []).map((q, i) => {
                const choices = (q.choices || []).map(c => {
                    const ok = Number(c.is_correct) === 1;
                    return `<li class="${ok ? 'tw-font-semibold tw-text-green-700' : 'tw-text-slate-600'}">
                        ${esc(c.text)}
                        ${ok ? `<span class="tw-ml-2 tw-text-xs tw-bg-green-100 tw-text-green-700 tw-rounded-full tw-px-2 tw-py-0.5">${esc(qmsLang['correctans'])}</span>` : ''}
                    </li>`;
                }).join('');
                return `<div class="q-block">
                    <p class="tw-font-semibold tw-text-slate-800 tw-mb-2">${i + 1}. ${esc(q.text)}</p>
                    <ul class="tw-list-disc tw-pl-6 tw-m-0 tw-flex tw-flex-col tw-gap-1">${choices}</ul>
                </div>`;
            }).join('') || `<p class="tw-text-slate-400 tw-m-0">${esc(qmsLang['noexam'])}</p>`;

            detailModal.show();
        } catch (err) {
            console.error('[qms] detail failed', err);
            showNotify(qmsLang['loadfailed']);
        } finally {
            hideLoading();
        }
    }

    // ---------- delete ----------
    function openDelete(exam) {
        deleteTargetId = exam.id;
        els.deleteExamName.textContent = exam.title ?? '';
        deleteModal.show();
    }

    async function confirmDelete() {
        if (!deleteTargetId) return;
        const fd = new FormData();
        fd.append('id', deleteTargetId);

        showLoading();
        els.confirmDeleteBtn.disabled = true;
        try {
            const res = await fetch('../config/exam_deleted.php', { method: 'POST', body: fd });
            const data = await res.json();
            deleteModal.hide();
            if (data.success) {
                showNotify(qmsLang['deletesuccess']);
                await loadExams();
            } else {
                showNotify(qmsLang['fail-exam']);
            }
        } catch (err) {
            console.error('[qms] delete failed', err);
            showNotify(qmsLang['fail-exam']);
        } finally {
            hideLoading();
            els.confirmDeleteBtn.disabled = false;
            deleteTargetId = null;
        }
    }
</script>
